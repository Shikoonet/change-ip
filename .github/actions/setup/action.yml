# Every job needs the same three things. One place, so a version bump is one
# edit and not five.
name: setup
description: python + ansible-core + hetzner.hcloud, and rotation.yml from the secret
inputs:
  rotation_config:
    description: contents of rotation.yml (the ROTATION_CONFIG secret)
    required: true
  expect_ipv4:
    description: >
      The address the operator typed on the dispatch form. Checked against the
      config, NOT written into it — see the assert step below.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: {python-version: '3.11'}
    - shell: bash
      run: |
        pip install --quiet --disable-pip-version-check ansible-core
        # PINNED. 7.0.0 removed the `datacenter` parameter and renamed every
        # datacenter field to `location`; hcloud_step.yml is written against
        # that vocabulary. An unpinned install resolved to 7.0.0 while the dev
        # box had 6.2.1, and the offline suite modelled 6.2.1 — three live
        # failures in a row, all of them this.
        ansible-galaxy collection install 'hetzner.hcloud:>=7.0.0,<8.0.0'
        # The collection's own requirements.txt, which ansible-galaxy does NOT
        # install. Without these every hcloud task dies with "Failed to import
        # the required Python library" — found by the first live run, because
        # an offline suite that never calls a module cannot see a module's
        # missing dependency.
        pip install --quiet --disable-pip-version-check requests python-dateutil
    - shell: bash
      # rotation.yml is not committed: it pins a real server id and a real
      # project fingerprint. Via env, not inline in the script — an inlined
      # ${{ }} would be pasted into the shell source and a stray quote in the
      # YAML would become a syntax error, or worse, a command.
      env:
        ROTATION_CONFIG: ${{ inputs.rotation_config }}
      run: |
        printf '%s' "$ROTATION_CONFIG" > rotation.yml
        test -s rotation.yml || { echo "ROTATION_CONFIG secret is empty."; exit 1; }
        mkdir -p state

    - shell: bash
      # The dispatch form asks for the address so the operator states out loud
      # which box they mean. Where that statement is CHECKED has moved: the
      # config no longer has to carry `expected_ipv4`, because pinning it in a
      # secret meant a human editing that secret after every successful
      # rotation — the address is the one field a rotation changes. When the
      # config omits it, the typed value goes to `rotate.py --expect-ipv4` and
      # is asserted against a fresh live read, which is a stronger check than
      # comparing two copies of the same guess. This step now only guards the
      # legacy shape, where a config still pins an address.
      env:
        EXPECT_IPV4: ${{ inputs.expect_ipv4 }}
      run: |
        python3 - <<'EOF'
        import os, socket, sys, yaml
        cfg = yaml.safe_load(open("rotation.yml"))["server"]
        if not cfg.get("expected_ipv4"):
            print("config pins no expected_ipv4 (good: it cannot go stale). "
                  "The typed address is asserted live by rotate.py instead.")
            raise SystemExit(0)
        for field, typed in (("expected_ipv4", os.environ["EXPECT_IPV4"]),):
            if typed and typed.strip() != str(cfg[field]):
                typed = typed.strip()
                # "Wrong server, or the config is stale" leaves a human holding
                # an `or`. The two cases look nothing alike from outside and we
                # can tell them apart cheaply: after a rotation the OLD address
                # is detached and answers nothing, while the address the
                # operator typed is the live one. That is not proof — a
                # firewall looks the same — so it is phrased as a lead, never
                # as a verdict.
                def reachable(ip):
                    try:
                        with socket.create_connection((ip, 22), timeout=4):
                            return True
                    except OSError:
                        return False
                hint = ""
                if reachable(typed) and not reachable(str(cfg[field])):
                    hint = (f"\n\nLIKELY STALE CONFIG, not the wrong server: "
                            f"{typed} answers on :22 and {cfg[field]} does not, "
                            f"which is what a completed rotation looks like from "
                            f"here. If that is right, set server.expected_ipv4 to "
                            f"{typed} in ROTATION_CONFIG on both hetzner-plan and "
                            f"hetzner-production and dispatch again.")
                sys.exit(f"REFUSING: you typed {field}={typed!r}, but the "
                         f"config says {cfg[field]!r}. Wrong server, or the config "
                         f"is stale — neither is safe to rotate.{hint}")
        print(f"target agrees: {cfg['expected_name']} on {cfg['expected_ipv4']} "
              f"in {cfg['expected_location']} (id {cfg['id']})")
        EOF
