# =============================================================================
# rollback — puts the OLD address back.
#
# Never automatic, and deliberately a SEPARATE workflow rather than a job in
# `rotate`. GitLab keeps a finished pipeline's manual jobs clickable; GitHub
# does not — a run that ended has no button left. So rollback takes the txid
# and the run it came from, and pulls that run's checkpoint back down.
#
# A node that is up on the new address is not an emergency, and swapping back
# does not fix a box that will not boot. Read the checkpoint first:
#   gh run download <run_id> -n rotation-state && python3 rotate.py status --txid <txid>
#
# The NEW address is RETAINED after a rollback. Deleting it is a separate
# decision with a separate approval.
# =============================================================================
name: rollback

on:
  workflow_dispatch:
    inputs:
      txid:
        description: 'Transaction id. The swap job printed it; state/ holds one JSON file per transaction.'
        required: true
      server_id:
        description: 'Hetzner server id. Must equal server.id in the config.'
        required: true
      run_id:
        description: 'The `rotate` run whose checkpoint to restore. Leave empty if state/ is already in this repo checkout (it is not, normally).'
        required: false

concurrency:
  group: rotate
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: hetzner-production
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: {rotation_config: "${{ secrets.ROTATION_CONFIG }}"}
      - name: Fetch the checkpoint from the rotate run
        if: inputs.run_id != ''
        run: |
          # -final first: if dns ran, that is the newer state. Either is a
          # valid resume point; the wrong one is a rollback of a transaction
          # that already moved on.
          gh run download "${{ inputs.run_id }}" -n rotation-state-final -D state/ \
            || gh run download "${{ inputs.run_id }}" -n rotation-state -D state/
      - name: Refuse without a checkpoint
        run: |
          test -f "state/${{ inputs.txid }}.json" || {
            echo "No checkpoint for ${{ inputs.txid }}. Pass run_id, or the"
            echo "artifact has expired (30 days) and this must be done by hand."
            exit 1; }
          python3 rotate.py status --config rotation.yml --txid "${{ inputs.txid }}"
      - run: |
          python3 rotate.py rollback --config rotation.yml \
            --txid "${{ inputs.txid }}" --confirm-server-id "${{ inputs.server_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rotation-state-rolledback, path: state/, retention-days: 30}
