# =============================================================================
# server-ip-rotation — the ONE workflow.
#
# Push / PR runs only the offline jobs: unit tests, self-test, the contract,
# lint. No secrets, no network, no cost. Every operation job is gated on
# `inputs.operation`, which a push does not have — so a git push can never
# reach `swap` no matter what else regresses. tests/contract.yml asserts that
# gate as text.
#
# `Run workflow` asks three things and nothing else: what to do, which server
# (its id), and the address that server is on right now. Everything else it
# needs is in the config secret or is re-read live from the API — a form field
# is a chance to mistype something the run could have proved instead.
#
# New capability later (node-onboard, node-update, node-monitoring) = one more
# `operation` choice + jobs gated on it, in THIS file — not a new workflow.
# A second datacenter needs no new field either: the config grows a second
# server and the id on the form picks it.
#
# WHAT REPLACED THE INTERACTIVE PROMPT.
#
# The tool was built around a human at a terminal: it powers the node down,
# swaps the address, then STOPS and waits for someone to type the new IP into
# shikoonet's inventory/hosts.yml before it moves DNS. A workflow has no stdin,
# and the honest way to keep that gate is not to pipe `yes` at it — it is to
# move the gate somewhere the workflow can actually fail on:
#
#   * the human pause was designed as an `environment:` with required
#     reviewers — GitLab's per-job manual button, in GitHub's vocabulary.
#     ⚠ THAT FEATURE IS PAID for private repositories. On a free plan the
#     "Deployment protection rules" section does not even render, so the
#     Waiting state never happens and the environment only scopes the secret.
#     The pause is therefore TWO DISPATCHES: `operation: plan` reads and
#     prints, `operation: change-ip` acts. And that is not left as a habit —
#     plan uploads a receipt and swap refuses without a fresh one naming the
#     same server. See swap's first step.
#   * the inventory edit becomes a COMMIT in the shikoonet repo, and the `dns`
#     job GREPS that checkout for the new address before it answers the prompt.
#     No commit, no answer, no DNS change.
#
# So `yes` is never a guess here. It is a fact the job re-derived from git.
#
# The human window is between `swap` and `dns`: the node is already up on the
# new address, DNS still points at the old one. That state is stable and
# resumable — take as long as the edit needs. `dns` fails until the inventory
# commit lands, so the window closes on a fact, not on a timer.
#
# ⚠ THIS HAS NEVER RUN AGAINST A REAL SERVER, and neither has the tool it
# drives. `--check` cannot validate the stop → detach → attach → start
# ordering, because the hcloud modules create no real actions in check mode.
# The first live run needs its own approval.
#
# -----------------------------------------------------------------------------
# SECRETS (Settings → Secrets and variables → Actions)
#
#   HCLOUD_TOKEN            the modules read it from the environment
#                           themselves — it is in no argv.
#   ROTATION_CONFIG         the contents of rotation.yml. Not committed: it
#                           pins a real server id and a real project
#                           fingerprint. It is the TRUTH — the two things the
#                           form asks for are checked against it, never
#                           written into it.
#                           ⚠ Paste it WITHOUT the leading `---`. Actions masks
#                           every line of a multi-line secret independently, so
#                           a `---` in there replaces every `---` this run ever
#                           prints with `***`.
#   SSH_PRIVATE_KEY         only `dns` needs it (ip-change.yml SSHes the node
#                           on its new address).
#   ANSIBLE_VAULT_PASSWORD  shikoonet's vault, for the Cloudflare token.
#   SHIKOONET_REPO          https URL of the shikoonet checkout, with a
#                           read-only token.
#
# Put HCLOUD_TOKEN on the ENVIRONMENT, not the repo: an environment secret is
# only readable by a job that has passed that environment's reviewers. A repo
# secret is readable by any workflow on any branch. Masking is not a boundary.
# =============================================================================
name: server-ip-rotation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: 'What to do. plan reads everything and changes nothing — run it first.'
        required: true
        type: choice
        options:
          - plan
          - change-ip
          - provider-only
          - rollback
      server_id:
        description: 'Server id — the number in the Hetzner console URL. Must equal server.id in the config.'
        required: true
      server_ip:
        description: 'The address the server is on RIGHT NOW. change-ip: the one being burned. rollback: the new one it is sitting on. provider-only: same as change-ip.'
        required: true

concurrency:
  # One rotation at a time — across operations too: a rollback racing the
  # change-ip it is rolling back is two runs sharing state/.
  group: rotate
  cancel-in-progress: false

# provider_only is a structural firewall: when the operator picks
# `provider-only` (a throwaway test server, or any case where DNS is
# handled out of band), this workflow MUST reach `connectivity_ok` and
# stop. It MUST NOT invoke `ip_change`, MUST NOT prompt for the
# inventory edit, MUST NOT run the Cloudflare playbook, and MUST NOT
# receive the Cloudflare token. The defense-in-depth server-side guard
# in rotate.py also enforces this — refusing the rotation up-front
# rather than half-completing it.
#
# The provider-rollback workflow path stays available: an operator who
# wants the old address back can still dispatch `rollback`. That
# operation has TWO steps: the provider half (no Cloudflare token) and,
# if DNS recovery is required, the Cloudflare half (token present only
# on that step). Provider-only never references the Cloudflare token at
# any job or step.

# The default GITHUB_TOKEN has no scope on artifacts. The rollback job reads
# rotation-state artifacts from earlier runs; granting only `actions: read` and
# `contents: read` keeps the surface minimal. Without this, urllib gets a 403
# from api.github.com and rollback dies before reading the checkpoint.
permissions:
  actions: read
  contents: read

jobs:
  # ===========================================================================
  # Offline half — the merge-request gate. Push and PR only: these belong to
  # the code review, not in front of a live operation. An operator dispatching
  # a rotation is acting on a commit that already passed them, and 40s of
  # unit tests between a decision and a powered-off node buys nothing.
  # ===========================================================================
  offline:
    name: unit + self-test + contract
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet ansible-core
      - run: python3 -m unittest discover -s tests -t .
      - run: python3 rotate.py --self-test
      - run: ansible-playbook tests/contract.yml

  lint:
    name: syntax, yamllint, ansible-lint
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet ansible-core ansible-lint yamllint
        # --syntax-check resolves module names, so the collection has to be here.
      - run: ansible-galaxy collection install --force 'hetzner.hcloud:>=7.0.0,<8.0.0'
      - run: ansible-playbook --syntax-check hcloud_step.yml cloudflare_replace_ip_step.yml tests/contract.yml
      - run: python3 -m compileall -q rotate.py providers.py ansible_adapter.py cloudflare_adapter.py
      - run: yamllint hcloud_step.yml cloudflare_replace_ip_step.yml tests/contract.yml rotation.example.yml || true
      - run: ansible-lint hcloud_step.yml cloudflare_replace_ip_step.yml || true

  # ===========================================================================
  # operation: change-ip
  # ===========================================================================
  # 1. plan — read-only against the real API. Safe, but it needs the token, so
  #    it still goes through an environment. `operation: plan` stops here: it
  #    is the dry run, and on a config that has never been used it is the only
  #    honest first move.
  plan:
    name: 1 · plan (read-only)
    if: inputs.operation == 'plan'
    runs-on: ubuntu-latest
    environment: hetzner-plan
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
          expect_ipv4: "${{ inputs.server_ip }}"
      - run: python3 rotate.py plan --config rotation.yml

  # 2. swap — THE PROVIDER HALF. Powers the node off, detaches the burned
  #    address, allocates a new one in the same datacenter, attaches it, powers
  #    back on, and waits for TCP on the SSH port.
  #
  #    `--until connectivity_ok` stops it exactly where the interactive tool
  #    asks a human to edit the inventory.
  #
  #    ⚠ Between the detach and the start the node has NO public address.
  #
  #    Provider-only path: same job, no DNS downstream. The Cloudflare
  #    playbook is never invoked; the `dns` job below is gated off by its
  #    own `if:` on `inputs.operation != 'provider-only'`.
  #
  #    SECRET SCOPE: the job-level env carries ONLY HCLOUD_TOKEN. The
  #    CLOUDFLARE_API_TOKEN env is defined at the step that actually needs
  #    it (the dns job, or the rollback DNS step) and is NEVER inherited
  #    by the swap job or by provider-only runs. A bare
  #    `${{ condition && '' || secret }}` ternary is FORBIDDEN — empty
  #    strings are falsy in GitHub Actions expressions, and the secret
  #    leaks through `||`.
  swap:
    name: 2 · swap the address (node is offline in here)
    if: inputs.operation == 'change-ip' || inputs.operation == 'provider-only'
    runs-on: ubuntu-latest
    environment: hetzner-production
    outputs:
      txid: ${{ steps.run.outputs.txid }}
      new_ip: ${{ steps.run.outputs.new_ip }}
      alias: ${{ steps.run.outputs.alias }}
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      # CLOUDFLARE_API_TOKEN is intentionally absent here. The provider
      # half never talks to Cloudflare; the token lives on the dns job
      # only.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
          expect_ipv4: "${{ inputs.server_ip }}"
      - id: run
        env:
          # The provider-only flag is a literal '1' or '0' string, never
          # an empty string — the previous `${{ cond && '1' || '' }}`
          # pattern is forbidden by the same expression-falsy rule.
          ROTATION_PROVIDER_ONLY: ${{ inputs.operation == 'provider-only' && '1' || '0' }}
        run: |
          set +e
          python3 rotate.py apply --config rotation.yml \
            --confirm-server-id "${{ inputs.server_id }}" --until connectivity_ok
          rc=$?
          set -e
          # 6 = paused at --until, the expected end of this job. Green on
          #     purpose: a normal stage boundary showing red is how a real
          #     escalation stops being noticed.
          # 5 = rolled_back: the tool already put the old address back. Red on
          #     purpose — nothing changed, but somebody has to read why.
          test "$rc" -eq 6 || exit "$rc"

          TXID=$(ls -t state/*.json | head -1 | xargs -n1 basename | sed 's/\.json$//')
          python3 rotate.py status --config rotation.yml --txid "$TXID"
          {
            echo "txid=$TXID"
            echo "new_ip=$(python3 -c "import json;print(json.load(open('state/$TXID.json'))['new_ip']['ip'])")"
            echo "alias=$(python3 -c "import json;print(json.load(open('state/$TXID.json'))['ansible']['host_alias'])")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rotation-state, path: state/, retention-days: 30}

  # 3. dns — the half that already worked. Runs `make ip-change HOST=<alias>`
  #    in a shikoonet checkout, which PATCHes the Cloudflare record in place
  #    and reads it back from the API as a gate.
  #
  #    THE GATE THAT REPLACED THE PROMPT is the grep below. rotate.py is about
  #    to ask "did you type the new address into the inventory?" — this job
  #    answers that from the shikoonet default branch, never from an
  #    assumption.
  dns:
    name: 3 · move DNS (gated by the inventory commit)
    needs: [swap]
    if: inputs.operation == 'change-ip'  # explicit, no falsy-ternary negation
    runs-on: ubuntu-latest
    environment: hetzner-production
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      TXID: ${{ needs.swap.outputs.txid }}
      NEW_IP: ${{ needs.swap.outputs.new_ip }}
      ALIAS: ${{ needs.swap.outputs.alias }}
      ANSIBLE_HOST_KEY_CHECKING: 'False'
      # CLOUDFLARE_API_TOKEN is NOT in this job-level env. It is set ONLY
      # on the step that actually invokes the Cloudflare playbook. That
      # step's `if:` already guarantees the token never reaches a run that
      # did not pass the inventory gate.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
          expect_ipv4: "${{ inputs.server_ip }}"
      - uses: actions/download-artifact@v4
        with: {name: rotation-state, path: state/}
      # Gate the WHOLE rest of the job on whether the node is in shikoonet's
      # inventory. An empty SHIKOONET_REPO or an absent inventory line is the
      # "right answer is skip, not fail" case: a throwaway test server is not
      # in shikoonet, and refusing to skip made every test run look red.
      - name: Is this node in shikoonet's inventory?
        id: in_scope
        env:
          SHIKOONET_REPO: ${{ secrets.SHIKOONET_REPO }}
        run: |
          set -e
          if [ -z "$SHIKOONET_REPO" ]; then
            echo "in_scope=false  (SHIKOONET_REPO is empty)"
          else
            git clone --depth 1 "$SHIKOONET_REPO" /tmp/shikoonet
            if grep -q -- "$NEW_IP" /tmp/shikoonet/inventory/hosts.yml; then
              echo "in_scope=true"
            else
              echo "in_scope=false  ($NEW_IP is not in shikoonet inventory/hosts.yml)"
            fi
          fi
          echo "in_scope=${in_scope:-false}" >> "$GITHUB_OUTPUT"
      - name: Resume the rotation in shikoonet
        if: steps.in_scope.outputs.in_scope == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          # The Cloudflare token lives ONLY on this step. It is present
          # in the env only when:
          #   1. inputs.operation == 'change-ip' (the job-level `if:`
          #      gates off provider-only entirely)
          #   2. AND the in_scope step confirmed this is a real rotation
          #      (the step-level `if:` gates off throwaway test servers)
          # Both gates are positive (`==`) so a broken token never
          # reaches the env via a falsy short-circuit.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          install -m 600 -D /dev/null ~/.vault_pass_pasarguard
          printf '%s\n' "$VAULT_PASSWORD" > ~/.vault_pass_pasarguard
          printf 'yes\n' | python3 rotate.py resume --config rotation.yml \
            --txid "$TXID" --confirm-server-id "${{ inputs.server_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rotation-state-final, path: state/, retention-days: 30}

  # 4. verify — the checkpoint says done, and says so on its own terms.
  # verify is gated on (a) operation == change-ip (NOT provider-only, NOT
  # a failed/skipped DNS) and (b) dns succeeded. Running after a failed
  # dns with `always()` would have meant a green "verify" against a
  # half-applied rotation; the gate below fixes that.
  verify:
    name: 4 · verify the checkpoint says done
    needs: [swap, dns]
    if: inputs.operation == 'change-ip' && needs.dns.result == 'success'
    runs-on: ubuntu-latest
    # No mutating access — just reads the artifact and the config. Sits on
    # hetzner-plan because that's where ROTATION_CONFIG lives; without an
    # environment, secrets.ROTATION_CONFIG reads from the repo (empty) and the
    # setup step fails with "ROTATION_CONFIG secret is empty" — exactly the
    # failure we just saw on run #42.
    environment: hetzner-plan
    env:
      TXID: ${{ needs.swap.outputs.txid }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
          expect_ipv4: "${{ inputs.server_ip }}"
      - uses: actions/download-artifact@v4
        with: {name: rotation-state-final, path: state/}
      - run: python3 rotate.py status --config rotation.yml --txid "$TXID"
      - run: |
          python3 - <<'EOF'
          import json, os, sys
          cp = json.load(open(f"state/{os.environ['TXID']}.json"))
          if cp.get("outcome") != "done":
              sys.exit(f"outcome is {cp.get('outcome')!r}, not 'done'")
          print(f"{cp['server']['expected_name']} is on {cp['new_ip']['ip']}; "
                f"{cp['old_ip']['ip']} is unassigned and RETAINED.")
          EOF
      - run: |
          echo "Now run 'make monitoring-doctor' in the shikoonet repo. It is the"
          echo "only thing that notices a node that is up but silently unmonitored."

  # ===========================================================================
  # operation: rollback — puts the OLD address back.
  #
  # Never automatic. GitLab keeps a finished pipeline's manual jobs clickable;
  # GitHub does not — a run that ended has no button left. So this one finds
  # the transaction itself: the newest unexpired checkpoint artifact in the
  # repo, then proves it is the box the operator meant before touching it.
  #
  # A node that is up on the new address is not an emergency, and swapping back
  # does not fix a box that will not boot. Read the checkpoint first:
  #   gh run download <run_id> -n rotation-state && python3 rotate.py status --txid <txid>
  #
  # The NEW address is RETAINED after a rollback. Deleting it is a separate
  # decision with a separate approval.
  # ===========================================================================
  rollback:
    name: roll back to the old IP
    if: inputs.operation == 'rollback'
    runs-on: ubuntu-latest
    environment: hetzner-production
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      # CLOUDFLARE_API_TOKEN is intentionally absent at the job level.
      # The DNS rollback step below carries it ONLY when the checkpoint
      # indicates DNS recovery is required. A provider rollback that
      # never touched Cloudflare skips that step entirely, and the
      # token never enters this process.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
      - name: Find the last transaction
        id: pick
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The operator is not asked for a txid. Typing one is a chance to
          # mistype one, and the answer is already in the artifacts: the newest
          # unexpired checkpoint IS the transaction to roll back.
          #
          # We need the run-id of the workflow_run that produced the artifact,
          # because actions/download-artifact defaults to THIS run's artifacts.
          # Without an explicit run-id, it sees nothing.
          python3 - <<'EOF'
          import json, os, sys, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          h = {"Authorization": f"Bearer {token}",
               "Accept": "application/vnd.github+json"}

          arts = json.loads(urllib.request.urlopen(urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100",
              headers=h)).read())["artifacts"]
          live = [a for a in arts
                  if not a["expired"] and a["name"].startswith("rotation-state")]
          if not live:
              sys.exit("No checkpoint artifact left. They expire after 30 days; "
                       "past that a rollback is done by hand from the console.")
          # Prefer rotation-state-final (the post-dns artifact) over the bare
          # one, so the rollback has the post-swap truth on disk.
          finals = [a for a in live if a["name"].endswith("-final")]
          art = max(finals or live, key=lambda a: a["created_at"])
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ARTIFACT_NAME={art['name']}\n")
              f.write(f"ARTIFACT_RUN_ID={art['workflow_run']['id']}\n")
          print(f"will restore {art['name']} from run {art['workflow_run']['id']}.")
          EOF
      - name: Download the checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: state/
          github-token: ${{ github.token }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
      - name: Refuse without a checkpoint
        run: |
          test -n "$(ls state/*.json 2>/dev/null)" || {
            echo "No rotation-state* artifact found. They expire after 30 days;"
            echo "past that a rollback is done by hand from the console."
            exit 1; }
      - name: Prove it is the box you meant
        id: cp
        env:
          SERVER_ID: ${{ inputs.server_id }}
          SERVER_IP: ${{ inputs.server_ip }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import glob, json, os, sys
          files = sorted(glob.glob("state/*.json"), key=os.path.getmtime)
          if not files:
              sys.exit("the artifact held no checkpoint")
          cp = json.load(open(files[-1]))
          txid = cp["txid"]
          # Two independent facts, both from the operator, both re-proved
          # against the checkpoint before anything is powered off. The address
          # typed on the form is the one the box is sitting on NOW — after a
          # swap that is the NEW one.
          if str(cp["server"]["id"]) != os.environ["SERVER_ID"].strip():
              sys.exit(f"{txid} is server {cp['server']['id']}, you typed "
                       f"{os.environ['SERVER_ID']}. Wrong transaction.")
          now = (cp.get("new_ip") or {}).get("ip") or cp["old_ip"]["ip"]
          if now != os.environ["SERVER_IP"].strip():
              sys.exit(f"{txid} left the box on {now}, you typed "
                       f"{os.environ['SERVER_IP']}. Read it before rolling back.")
          print(f"txid={txid}")
          EOF
      - run: python3 rotate.py status --config rotation.yml --txid "${{ steps.cp.outputs.txid }}"
      # Provider half only — no Cloudflare token. The DNS step below is
      # gated on the checkpoint showing DNS recovery is required.
      - name: Roll back the provider IP
        run: |
          python3 rotate.py rollback --config rotation.yml \
            --txid "${{ steps.cp.outputs.txid }}" \
            --confirm-server-id "${{ inputs.server_id }}" \
            --no-dns-rollback
      # Decide from the checkpoint whether DNS recovery is required. This
      # is a positive check (==) on a real field; no falsy-ternary trick.
      - name: Decide whether DNS rollback is required
        id: need_dns
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import glob, json
          files = sorted(glob.glob("state/*.json"), key=os.path.getmtime)
          cp = json.load(open(files[-1]))
          needs_dns = (
              cp.get("cloudflare_apply_started") is not None
              or cp.get("cloudflare_apply") is not None
              or ((cp.get("ansible") or {}).get("rc") == 0)
          )
          print(f"needs_dns_rollback={'true' if needs_dns else 'false'}")
          EOF
      # The DNS rollback step. CLOUDFLARE_API_TOKEN lives ONLY here.
      # The gate is a positive == on the previous step's output. When
      # the previous step set needs_dns_rollback=false, this step is
      # skipped, the token is never exported, and the env block is
      # never evaluated against `secrets.CLOUDFLARE_API_TOKEN`.
      - name: Roll back the DNS records
        if: steps.need_dns.outputs.needs_dns_rollback == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 rotate.py rollback --config rotation.yml \
            --txid "${{ steps.cp.outputs.txid }}" \
            --confirm-server-id "${{ inputs.server_id }}" \
            --dns-rollback-only
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rotation-state-rolledback, path: state/, retention-days: 30}
