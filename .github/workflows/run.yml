# =============================================================================
# server-ip-rotation — the ONE workflow.
#
# Push / PR runs only the offline jobs: unit tests, self-test, the contract,
# lint. No secrets, no network, no cost. Every operation job is gated on
# `inputs.operation`, which a push does not have — so a git push can never
# reach `swap` no matter what else regresses. tests/contract.yml asserts that
# gate as text.
#
# `Run workflow` asks three things and nothing else: what to do, which server
# (its id), and the address that server is on right now. Everything else it
# needs is in the config secret or is re-read live from the API — a form field
# is a chance to mistype something the run could have proved instead.
#
# New capability later (node-onboard, node-update, node-monitoring) = one more
# `operation` choice + jobs gated on it, in THIS file — not a new workflow.
# A second datacenter needs no new field either: the config grows a second
# server and the id on the form picks it.
#
# WHAT REPLACED THE INTERACTIVE PROMPT.
#
# The tool was built around a human at a terminal: it powers the node down,
# swaps the address, then STOPS and waits for someone to type the new IP into
# shikoonet's inventory/hosts.yml before it moves DNS. A workflow has no stdin,
# and the honest way to keep that gate is not to pipe `yes` at it — it is to
# move the gate somewhere the workflow can actually fail on:
#
#   * the human pause was designed as an `environment:` with required
#     reviewers — GitLab's per-job manual button, in GitHub's vocabulary.
#     ⚠ THAT FEATURE IS PAID for private repositories. On a free plan the
#     "Deployment protection rules" section does not even render, so the
#     Waiting state never happens and the environment only scopes the secret.
#     The pause is therefore TWO DISPATCHES: `operation: plan` reads and
#     prints, `operation: change-ip` acts. And that is not left as a habit —
#     plan uploads a receipt and swap refuses without a fresh one naming the
#     same server. See swap's first step.
#   * the inventory edit becomes a COMMIT in the shikoonet repo, and the `dns`
#     job GREPS that checkout for the new address before it answers the prompt.
#     No commit, no answer, no DNS change.
#
# So `yes` is never a guess here. It is a fact the job re-derived from git.
#
# The human window is between `swap` and `dns`: the node is already up on the
# new address, DNS still points at the old one. That state is stable and
# resumable — take as long as the edit needs. `dns` fails until the inventory
# commit lands, so the window closes on a fact, not on a timer.
#
# ⚠ THIS HAS NEVER RUN AGAINST A REAL SERVER, and neither has the tool it
# drives. `--check` cannot validate the stop → detach → attach → start
# ordering, because the hcloud modules create no real actions in check mode.
# The first live run needs its own approval.
#
# -----------------------------------------------------------------------------
# SECRETS (Settings → Secrets and variables → Actions)
#
#   HCLOUD_TOKEN            the modules read it from the environment
#                           themselves — it is in no argv.
#   ROTATION_CONFIG         the contents of rotation.yml. Not committed: it
#                           pins a real server id and a real project
#                           fingerprint. It is the TRUTH — the two things the
#                           form asks for are checked against it, never
#                           written into it.
#                           ⚠ Paste it WITHOUT the leading `---`. Actions masks
#                           every line of a multi-line secret independently, so
#                           a `---` in there replaces every `---` this run ever
#                           prints with `***`.
#   SSH_PRIVATE_KEY         only `dns` needs it (ip-change.yml SSHes the node
#                           on its new address).
#   ANSIBLE_VAULT_PASSWORD  shikoonet's vault, for the Cloudflare token.
#   SHIKOONET_REPO          https URL of the shikoonet checkout, with a
#                           read-only token.
#
# Put HCLOUD_TOKEN on the ENVIRONMENT, not the repo: an environment secret is
# only readable by a job that has passed that environment's reviewers. A repo
# secret is readable by any workflow on any branch. Masking is not a boundary.
# =============================================================================
name: server-ip-rotation

on:
  # Live operations only. The offline CI (push + pull_request) is
  # the dedicated `ci.yml` workflow; this file MUST NOT carry a
  # push or pull_request trigger so a code push can never reach
  # the live mutation jobs.
  workflow_dispatch:
    inputs:
      operation:
        description: 'What to do. plan reads everything and changes nothing — run it first.'
        required: true
        type: choice
        options:
          - plan
          - change-ip
          - provider-only
          - dns-scan
          - release-old-ip
          - rollback
          - finalize
      provider:
        description: 'Provider. hcloud is the original Hetzner Cloud path; dataforest is the new two-phase Seed flow.'
        required: true
        type: choice
        default: hcloud
        options:
          - hcloud
          - dataforest
      server_id:
        description: 'Hetzner server id OR DataForest Seed UUID. Must equal server.id in the config.'
        required: true
      server_ip:
        description: 'The address the server is on RIGHT NOW. change-ip/provider-only: the old IP. rollback: the new IP on the first attempt, or the old IP when resuming after provider rollback. dns-scan: the address to SEARCH DNS for; it need not be current.'
        required: true
      dns_names:
        description: 'Optional extra assertion, comma- or space-separated. You do NOT need to list every record: preflight automatically finds every A record on the old IP across every visible zone and every result page. If supplied, each name must be in that manifest. A full change-ip also refuses an empty manifest before anything moves; use provider-only only when DNS is intentionally out of scope.'
        required: false
        default: ''

concurrency:
  # Live operations only. `cancel-in-progress: false` is mandatory:
  # cancelling a mid-mutation run would interrupt a powered-off node
  # and leave DNS in a half-patched state. Live operations are
  # dispatched by a human; the cancel is the human's `gh run cancel`.
  # The discriminator is `inputs.server` (change-ip / provider-only)
  # OR `inputs.txid` (rollback / finalize), so two different
  # operations on the same node never share the lock.
  group: rotation-${{ inputs.server_id || inputs.txid }}
  cancel-in-progress: false

# provider_only is a structural firewall: when the operator picks
# `provider-only` (a throwaway test server, or any case where DNS is
# handled out of band), this workflow MUST reach `connectivity_ok` and
# stop. It MUST NOT invoke `ip_change`, MUST NOT prompt for the
# inventory edit, MUST NOT run the Cloudflare playbook, and MUST NOT
# receive the Cloudflare token. The defense-in-depth server-side guard
# in rotate.py also enforces this — refusing the rotation up-front
# rather than half-completing it.
#
# The provider-rollback workflow path stays available: an operator who
# wants the old address back can still dispatch `rollback`. That
# operation has TWO steps: the provider half (no Cloudflare token) and,
# if DNS recovery is required, the Cloudflare half (token present only
# on that step). Provider-only never references the Cloudflare token at
# any job or step.

# The default GITHUB_TOKEN has no scope on artifacts. The rollback job reads
# rotation-state artifacts from earlier runs; granting only `actions: read` and
# `contents: read` keeps the surface minimal. Without this, urllib gets a 403
# from api.github.com and rollback dies before reading the checkpoint.
permissions:
  actions: read
  contents: read

jobs:
  # ===========================================================================
  # operation: change-ip
  # ===========================================================================
  # 1. plan — read-only against the real API. Safe, but it needs the token, so
  #    it still goes through an environment. `operation: plan` stops here: it
  #    is the dry run, and on a config that has never been used it is the only
  #    honest first move.
  # Two provider-scoped plan jobs. Each carries ONLY its provider's
  # token — Hetzner plan never sees DATAFOREST_API_TOKEN, DataForest
  # plan never sees HCLOUD_TOKEN. The Python `plan` command performs
  # only GETs (read-only); the operator's intent is captured by the
  # provider field on the dispatch form, not by which token is loaded.
  plan:
    name: 1 · plan (Hetzner, read-only)
    if: inputs.operation == 'plan' && inputs.provider == 'hcloud'
    runs-on: ubuntu-latest
    environment: hetzner-plan
    timeout-minutes: 30
    env:
      # HCLOUD_TOKEN only. The DataForest PAT is NOT in this env block.
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
          expect_ipv4: "${{ inputs.server_ip }}"
      # The typed address goes to the tool, which checks it against a fresh
      # read of the server. Passing it here rather than pinning it in the
      # secret is what stops ROTATION_CONFIG going stale after every rotation.
      - run: |
          python3 rotate.py plan --config rotation.yml \
            --confirm-server-id "${{ inputs.server_id }}" \
            --expect-ipv4 "${{ inputs.server_ip }}"

  plan_dataforest:
    name: 1 · plan (DataForest, read-only)
    if: inputs.operation == 'plan' && inputs.provider == 'dataforest'
    runs-on: ubuntu-latest
    environment: dataforest-production
    timeout-minutes: 30
    env:
      DATAFOREST_API_TOKEN: ${{ secrets.DATAFOREST_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
          expect_ipv4: "${{ inputs.server_ip }}"
      - run: python3 rotate.py plan --config rotation.yml

  # 2. swap — THE PROVIDER HALF. Powers the node off, detaches the burned
  #    address, allocates a new one in the same datacenter, attaches it, powers
  #    back on, and waits for TCP on the SSH port.
  #
  #    `--until connectivity_ok` stops it exactly where the interactive tool
  #    asks a human to edit the inventory.
  #
  #    ⚠ Between the detach and the start the node has NO public address.
  #
  #    Provider-only path: same job, no DNS downstream. The Cloudflare
  #    playbook is never invoked; the `dns` job below is gated off by its
  #    own `if:` on `inputs.operation != 'provider-only'`.
  #
  #    SECRET SCOPE: the job-level env carries ONLY HCLOUD_TOKEN. The
  #    CLOUDFLARE_API_TOKEN env is defined at the step that actually needs
  #    it (the dns job, or the rollback DNS step) and is NEVER inherited
  #    by the swap job or by provider-only runs. A bare
  #    `${{ condition && '' || secret }}` ternary is FORBIDDEN — empty
  #    strings are falsy in GitHub Actions expressions, and the secret
  #    leaks through `||`.
  swap:
    name: 2 · swap the address (node is offline in here)
    if: (inputs.operation == 'change-ip' || inputs.operation == 'provider-only')
        && inputs.provider == 'hcloud'
    runs-on: ubuntu-latest
    environment: hetzner-production
    timeout-minutes: 30
    outputs:
      txid: ${{ steps.run.outputs.txid }}
      new_ip: ${{ steps.run.outputs.new_ip }}
      old_ip: ${{ steps.run.outputs.old_ip }}
      alias: ${{ steps.run.outputs.alias }}
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      # No Cloudflare token at JOB level. change-ip needs one exactly once in
      # here — the preflight step below, which builds the DNS manifest BEFORE
      # anything is allocated or powered off — and that step carries it
      # itself, gated on the operation. The swap step that follows holds only
      # the Hetzner token, and provider-only never sees a Cloudflare token.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
          expect_ipv4: "${{ inputs.server_ip }}"
      # provider-only needs no flag here: this job already stops at
      # `--until connectivity_ok`, and the `dns` job is gated off by
      # `inputs.operation == 'change-ip'`. The old ROTATION_PROVIDER_ONLY env
      # was read by nothing in rotate.py — a flag that looked like a control.
      # change-ip: the DNS manifest FIRST, while the box still has its
      # address. Every configured account is asked which A records point at
      # it (the allowlist is a floor, usually empty), and the manifest is
      # persisted on the checkpoint — it is the only thing the later PATCH
      # ever touches. A bad token or an unreadable zone fails HERE, before a
      # Primary IP is billed or a box goes dark. Pauses at
      # cloudflare_preflighted, which is rc 6.
      - name: Preflight DNS — build the manifest before anything moves (change-ip)
        if: inputs.operation == 'change-ip'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ACCOUNT_A: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_A }}
          CLOUDFLARE_API_TOKEN_ACCOUNT_B: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_B }}
          DNS_NAMES: ${{ inputs.dns_names }}
        run: |
          set +e
          names=""
          for n in $(printf '%s' "$DNS_NAMES" | tr ',' ' '); do
            names="$names --dns-name $n"
          done
          python3 rotate.py apply --config rotation.yml \
            --confirm-server-id "${{ inputs.server_id }}" \
            --expect-ipv4 "${{ inputs.server_ip }}" $names \
            --until cloudflare_preflighted
          rc=$?
          set -e
          test "$rc" -eq 6 || exit "$rc"
          python3 -c "
          import json, glob, os
          cp = json.load(open(sorted(glob.glob('state/*.json'), key=os.path.getmtime)[-1]))
          m = cp.get('cloudflare_manifest') or []
          print(f'manifest: {len(m)} A record(s) will move with this address')
          for r in m[:50]:
              print('  ' + r['name'])
          if len(m) > 50:
              print(f'  ... {len(m) - 50} more record(s); manifest is complete')"
      - id: run
        run: |
          set +e
          if [ "${{ inputs.operation }}" = "change-ip" ]; then
            # Resume the checkpoint the preflight step just created. Nothing
            # from Cloudflare is in this step's env: from here to
            # connectivity_ok the run only talks to Hetzner.
            TXID=$(ls -t state/*.json | head -1 | xargs -n1 basename | sed 's/\.json$//')
            python3 rotate.py resume --config rotation.yml --txid "$TXID" \
              --confirm-server-id "${{ inputs.server_id }}" --until connectivity_ok
          else
            # provider-only is declared per RUN, not pinned in the config:
            # the same project rotates a throwaway box today and a real node
            # tomorrow with nothing edited in between.
            python3 rotate.py apply --config rotation.yml --provider-only \
              --confirm-server-id "${{ inputs.server_id }}" \
              --expect-ipv4 "${{ inputs.server_ip }}" --until connectivity_ok
          fi
          rc=$?
          set -e
          # 6 = paused at --until, the expected end of this job. Green on
          #     purpose: a normal stage boundary showing red is how a real
          #     escalation stops being noticed.
          # 5 = rolled_back: the tool already put the old address back. Red on
          #     purpose — nothing changed, but somebody has to read why.
          test "$rc" -eq 6 || exit "$rc"

          TXID=$(ls -t state/*.json | head -1 | xargs -n1 basename | sed 's/\.json$//')
          python3 rotate.py status --config rotation.yml --txid "$TXID"
          {
            echo "txid=$TXID"
            echo "new_ip=$(python3 -c "import json;print(json.load(open('state/$TXID.json'))['new_ip']['ip'])")"
            echo "old_ip=$(python3 -c "import json;print(json.load(open('state/$TXID.json'))['old_ip']['ip'])")"
            echo "alias=$(python3 -c "import json;print(json.load(open('state/$TXID.json'))['alias'])")"
          } >> "$GITHUB_OUTPUT"
      # Nothing to update after this run. ROTATION_CONFIG carries only what
      # cannot change under a rotation — id, name, location, project
      # fingerprint — so it stays correct across any number of rotations. The
      # address is stated per-run on the dispatch form and checked against a
      # live read, which is why there is no "now edit the secret" step here
      # any more. All the operator needs is the number for next time.
      - name: The address for the next dispatch
        if: always() && steps.run.outputs.new_ip != ''
        env:
          NEW_IP: ${{ steps.run.outputs.new_ip }}
        run: |
          {
            echo "This box is now on $NEW_IP."
            echo "Type that as 'server_ip' on the next dispatch. No secret,"
            echo "config or environment needs editing — nothing went stale."
          }
      # THE ONE DELETE. Only when the config says old_ip.retention: release,
      # only on a provider-only run (the DNS half is out of scope by design,
      # so connectivity_ok IS the finish line), and only after rotate.py has
      # re-read the server on the new address and the old Primary IP attached
      # to nothing. A change-ip run releases in `verify` instead, after `done`.
      # Same job, same reviewer: the person who approved the swap approved
      # this. After it there is no rollback to the old address.
      - name: Release the old address (retention=release, provider-only)
        if: steps.run.outputs.txid != '' && inputs.operation == 'provider-only'
        env:
          TXID: ${{ steps.run.outputs.txid }}
        run: |
          set -e
          retention=$(python3 -c "import yaml;print((yaml.safe_load(open('rotation.yml')).get('old_ip') or {}).get('retention','keep'))")
          echo "old_ip.retention = $retention"
          if [ "$retention" != "release" ]; then
            echo "keep: the old address stays retained. Nothing deleted."
            exit 0
          fi
          python3 rotate.py release-old-ip --config rotation.yml \
            --txid "$TXID" --confirm-server-id "${{ inputs.server_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rotation-state, path: state/, retention-days: 3}

  # 2'. DataForest swap — the Seed keeps BOTH addresses throughout. The
  #     apply path runs in FOUR separate jobs, each with only the token
  #     its stage requires. A single subprocess carrying both tokens is
  #     the contradiction this rewrite exists to remove.
  #
  #     Stage | Subprocess                       | Token
  #     ──────┼──────────────────────────────────┼─────────────────────
  #     2a    | apply --until new_ip_allocated   | DATAFOREST only
  #     2b    | resume --until guest_configured  | DATAFOREST only
  #     2c    | resume --until guest_verified    | DATAFOREST only
  #     2d    | resume --until cloudflare_prefl. | CLOUDFLARE only
  #     2e    | resume --until ansible_done      | CLOUDFLARE only
  #     2f    | resume --until cloudflare_replaced | CLOUDFLARE only
  #     2g    | resume --until awaiting_finalize | CLOUDFLARE only
  #
  #     The CLI refuses (EXIT_USAGE) if the wrong token is in scope, so
  #     a leaked CLOUDFLARE_API_TOKEN on a provider stage fails loudly
  #     instead of silently mixing secrets. This is enforced by the
  #     --until gate in rotate.py: provider/guest --until names MUST run
  #     WITHOUT CLOUDFLARE_API_TOKEN in env; DNS --until names MUST run
  #     WITH it. The token-presence assertion is a hard fail.
  swap_dataforest:
    name: 2a · DataForest provider preflight + allocate (DF token only)
    if: (inputs.operation == 'change-ip' || inputs.operation == 'provider-only')
        && inputs.provider == 'dataforest'
    runs-on: ubuntu-latest
    environment: dataforest-production
    timeout-minutes: 30
    outputs:
      txid: ${{ steps.run.outputs.txid }}
      new_ip: ${{ steps.run.outputs.new_ip }}
      alias: ${{ steps.run.outputs.alias }}
    env:
      DATAFOREST_API_TOKEN: ${{ secrets.DATAFOREST_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      # CLOUDFLARE_API_TOKEN intentionally absent. The CLI refuses to
      # advance a provider stage with the CF token in scope.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
          expect_ipv4: "${{ inputs.server_ip }}"
      - id: run
        run: |
          set +e
          python3 rotate.py apply --config rotation.yml \
            --confirm-server-id "${{ inputs.server_id }}" \
            --until new_ip_allocated
          rc=$?
          set -e
          # 6 = paused at --until (expected end). Green on purpose:
          # a normal stage boundary showing red is how a real
          # escalation stops being noticed.
          # 5 = rolled_back: the tool already put the old address
          # back. Red on purpose — nothing changed, but somebody has
          # to read why.
          test "$rc" -eq 6 || exit "$rc"

          TXID=$(ls -t state/*.json | head -1 | xargs -n1 basename | sed 's/\.json$//')
          python3 rotate.py status --config rotation.yml --txid "$TXID"
          {
            echo "txid=$TXID"
            echo "new_ip=$(python3 -c "import json;print(json.load(open('state/$TXID.json'))['new_ip']['ip'])")"
            echo "alias=$(python3 -c "import json;print(json.load(open('state/$TXID.json'))['ansible']['host_alias'])")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rotation-state, path: state/, retention-days: 3}

  swap_dataforest_guest:
    name: 2b-c · DataForest guest configure + verify (no provider token)
    if: (inputs.operation == 'change-ip' || inputs.operation == 'provider-only')
        && inputs.provider == 'dataforest'
    needs: [swap_dataforest]
    runs-on: ubuntu-latest
    # GUEST STAGE: no environment, no provider token. The job is
    # token-free; the rotation's identity check at this stage
    # consumes the digest-bound `dataforest_identity_ok` marker
    # persisted by the previous job, NOT a fresh Seed read.
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
          expect_ipv4: "${{ inputs.server_ip }}"
      - uses: actions/download-artifact@v4
        with: {name: rotation-state, path: state/}
      - name: 2b · configure guest (no provider token; identity marker only)
        run: |
          python3 .github/scripts/stage.py \
            --expect-rc 6 \
            --expect-state guest_configured \
            --txid "${{ needs.swap_dataforest.outputs.txid }}" \
            --label "2b.configure_guest" \
            -- python3 rotate.py resume --config rotation.yml \
              --txid "${{ needs.swap_dataforest.outputs.txid }}" \
              --confirm-server-id "${{ inputs.server_id }}" \
              --until guest_configured
      - name: 2c · verify guest (no provider token; identity marker only)
        run: |
          python3 .github/scripts/stage.py \
            --expect-rc 6 \
            --expect-state guest_verified \
            --txid "${{ needs.swap_dataforest.outputs.txid }}" \
            --label "2c.verify_guest" \
            -- python3 rotate.py resume --config rotation.yml \
              --txid "${{ needs.swap_dataforest.outputs.txid }}" \
              --confirm-server-id "${{ inputs.server_id }}" \
              --until guest_verified
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rotation-state-guest, path: state/, retention-days: 3}

  swap_dataforest_dns:
    name: 2d-g · DataForest DNS preflight + Ansible + PATCH + await finalize (CF tokens only)
    if: inputs.operation == 'change-ip' && inputs.provider == 'dataforest'
    # swap_dataforest_dns reads `needs.swap_dataforest.outputs.{txid,new_ip,alias}`
    # in the in_scope gate and every resume stage. The swap_dataforest_guest
    # job does NOT export those outputs — only swap_dataforest does. Without
    # this dependency GitHub substitutes an empty string for every
    # `needs.swap_dataforest.outputs.*` reference, rotate.py resume runs
    # with --txid "" and the gate reads empty NEW_IP/ALIAS, and the
    # DataForest DNS stages silently skip. (actionlint flags the same.)
    needs: [swap_dataforest, swap_dataforest_guest]
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 30
    env:
      # Two-account Cloudflare is the only DNS path. No legacy
      # CLOUDFLARE_API_TOKEN is exported: an account-A token is NEVER
      # aliased to the legacy variable, and account B is never aliased
      # to A. The per-account playbook call selects exactly one token
      # through token_env; the adapter scrubs the others from the
      # child env so a process for one account cannot read the other.
      CLOUDFLARE_API_TOKEN_ACCOUNT_A: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_A }}
      CLOUDFLARE_API_TOKEN_ACCOUNT_B: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_B }}
      GH_TOKEN: ${{ github.token }}
      ANSIBLE_HOST_KEY_CHECKING: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
          expect_ipv4: "${{ inputs.server_ip }}"
      - uses: actions/download-artifact@v4
        with: {name: rotation-state-guest, path: state/}
      - name: 2d · Cloudflare preflight (CF token only)
        run: |
          python3 .github/scripts/stage.py \
            --expect-rc 6 \
            --expect-state cloudflare_preflighted \
            --txid "${{ needs.swap_dataforest.outputs.txid }}" \
            --label "2d.cloudflare_preflight" \
            --expect-marker cloudflare_manifest \
            -- python3 rotate.py resume --config rotation.yml \
              --txid "${{ needs.swap_dataforest.outputs.txid }}" \
              --confirm-server-id "${{ inputs.server_id }}" \
              --until cloudflare_preflighted
      # Two steps, same reason as the hcloud dns job: the step that writes
      # $GITHUB_OUTPUT may not hold credentials.
      - name: Fetch shikoonet (credentials live here, no outputs)
        env:
          SHIKOONET_REPO: ${{ secrets.SHIKOONET_REPO }}
          SHIKOONET_PAT: ${{ secrets.SHIKOONET_PAT }}
          ADMIN_PAT: ${{ secrets.ADMIN_PAT }}
        run: |
          set -e
          rm -rf /tmp/shikoonet /tmp/shikoonet.absent
          if [ -z "$SHIKOONET_REPO" ]; then
            touch /tmp/shikoonet.absent; exit 0
          fi
          tok="${SHIKOONET_PAT:-$ADMIN_PAT}"
          if [ -z "$tok" ]; then
            echo "::error::neither SHIKOONET_PAT nor ADMIN_PAT is set; cannot read $SHIKOONET_REPO"
            exit 1
          fi
          tokf=$(mktemp); chmod 600 "$tokf"; printf '%s' "$tok" > "$tokf"
          if ! git -c "credential.helper=!f() { echo username=x-access-token; echo password=$(cat $tokf); }; f" \
                 clone --depth 1 --quiet "$SHIKOONET_REPO" /tmp/shikoonet; then
            rm -f "$tokf"
            echo "::error::clone of shikoonet failed; the token in use cannot read it"
            exit 1
          fi
          rm -f "$tokf"
      - name: Is the inventory edit committed in shikoonet?
        id: in_scope
        env:
          NEW_IP: ${{ needs.swap_dataforest.outputs.new_ip }}
          ALIAS: ${{ needs.swap_dataforest.outputs.alias }}
        run: |
          set -e
          # Assign in_scope to the actual shell scope — NOT just stdout. The
          # earlier version only echoed `in_scope=true|false` and never
          # exported it, so `${in_scope:-false}` always expanded to
          # `false` and the next steps' `if:` gates always skipped the
          # DataForest DNS stages.
          in_scope=false
          if [ ! -e /tmp/shikoonet.absent ] && grep -q -- "$NEW_IP" /tmp/shikoonet/inventory/hosts.yml; then
            in_scope=true
          fi
          echo "in_scope=$in_scope" >> "$GITHUB_OUTPUT"
      - name: 2e · Ansible + inventory (no provider/DNS token)
        if: steps.in_scope.outputs.in_scope == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          install -m 600 -D /dev/null ~/.vault_pass_pasarguard
          printf '%s\n' "$VAULT_PASSWORD" > ~/.vault_pass_pasarguard
          python3 .github/scripts/stage.py \
            --expect-rc 6 \
            --expect-state ansible_done \
            --txid "${{ needs.swap_dataforest.outputs.txid }}" \
            --label "2e.ansible" \
            -- python3 rotate.py resume --config rotation.yml \
              --txid "${{ needs.swap_dataforest.outputs.txid }}" \
              --confirm-server-id "${{ inputs.server_id }}" \
              --until ansible_done
      - name: 2f · Cloudflare PATCH (apply, CF token only)
        if: steps.in_scope.outputs.in_scope == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 .github/scripts/stage.py \
            --expect-rc 6 \
            --expect-state cloudflare_replaced \
            --txid "${{ needs.swap_dataforest.outputs.txid }}" \
            --label "2f.cloudflare_replace" \
            --expect-marker cloudflare_apply \
            -- python3 rotate.py resume --config rotation.yml \
              --txid "${{ needs.swap_dataforest.outputs.txid }}" \
              --confirm-server-id "${{ inputs.server_id }}" \
              --until cloudflare_replaced
      - name: 2g · await_finalize (CF token only)
        run: |
          python3 .github/scripts/stage.py \
            --expect-rc 6 \
            --expect-state awaiting_finalize \
            --txid "${{ needs.swap_dataforest.outputs.txid }}" \
            --label "2g.awaiting_finalize" \
            -- python3 rotate.py resume --config rotation.yml \
              --txid "${{ needs.swap_dataforest.outputs.txid }}" \
              --confirm-server-id "${{ inputs.server_id }}" \
              --until awaiting_finalize
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rotation-state-dns, path: state/, retention-days: 3}

  # 3. dns — the half that already worked. Runs `make ip-change HOST=<alias>`
  #    in a shikoonet checkout, which PATCHes the Cloudflare record in place
  #    and reads it back from the API as a gate.
  #
  #    THE GATE THAT REPLACED THE PROMt is the grep below. rotate.py is about
  #    to ask "did you type the new address into the inventory?" — this job
  #    answers that from the shikoonet default branch, never from an
  #    assumption.
  dns:
    name: 3 · move DNS (gated by the inventory commit)
    needs: [swap]
    if: inputs.operation == 'change-ip'
        && inputs.provider == 'hcloud'
    runs-on: ubuntu-latest
    environment: hetzner-production
    timeout-minutes: 30
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      TXID: ${{ needs.swap.outputs.txid }}
      NEW_IP: ${{ needs.swap.outputs.new_ip }}
      ALIAS: ${{ needs.swap.outputs.alias }}
      ANSIBLE_HOST_KEY_CHECKING: 'False'
      # CLOUDFLARE_API_TOKEN is NOT in this job-level env. It is set ONLY
      # on the step that actually invokes the Cloudflare playbook. That
      # step's `if:` already guarantees the token never reaches a run that
      # did not pass the inventory gate.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
          expect_ipv4: "${{ inputs.server_ip }}"
      - uses: actions/download-artifact@v4
        with: {name: rotation-state, path: state/}
      # Gate the WHOLE rest of the job on whether the node is in shikoonet's
      # inventory. An empty SHIKOONET_REPO or an absent inventory line is the
      # "right answer is skip, not fail" case: a throwaway test server is not
      # in shikoonet, and refusing to skip made every test run look red.
      # ---- consume the preflight manifest --------------------------------
      # The swap job built this manifest BEFORE touching Hetzner. It scanned
      # every visible zone and every result page, and full `change-ip` now
      # refuses an empty manifest. Do not scan a second time and reinterpret
      # "zero" as out-of-scope: run 34321050608 proved that a stale but valid
      # token can make that branch green while an unseen record still points
      # at the address about to be released.
      #
      # This step carries no credential. It only proves that the persisted
      # manifest is non-empty and bound to this transaction's OLD_IP. One
      # record or thousands use the same path below.
      - name: Require the persisted DNS manifest
        id: decide
        env:
          OLD_IP: ${{ needs.swap.outputs.old_ip }}
          TXID: ${{ needs.swap.outputs.txid }}
        run: |
          python3 - <<'PYX'
          import json, os, sys
          cp = json.load(open(f"state/{os.environ['TXID']}.json"))
          old_ip = (cp.get("old_ip") or {}).get("ip")
          if old_ip != os.environ["OLD_IP"]:
              sys.exit(f"checkpoint OLD_IP {old_ip!r} != workflow OLD_IP {os.environ['OLD_IP']!r}")
          manifest = cp.get("cloudflare_manifest") or []
          if not manifest:
              sys.exit("full change-ip has an empty Cloudflare manifest; refusing DNS-out-of-scope")
          print(f"dns_scope=records ({len(manifest)} A record(s))")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("dns_scope=records\n")
          PYX

      # ---- records exist: the inventory gate --------------------------------
      # TWO steps on purpose. The contract forbids a step that writes
      # $GITHUB_OUTPUT from also holding token-shaped data, so a step that
      # can leak a credential into an output cannot exist. The clone carries
      # the credentials and writes no output; the decision reads the checkout
      # and carries no credentials.
      - name: Fetch shikoonet (credentials live here, no outputs)
        if: steps.decide.outputs.dns_scope == 'records'
        env:
          SHIKOONET_REPO: ${{ secrets.SHIKOONET_REPO }}
          # shikoonet is a PRIVATE repo, so an anonymous clone gets
          # "could not read Username for 'https://github.com'" and exit 128 —
          # which is what killed this job on 2026-09-08 after the address had
          # already moved. SHIKOONET_PAT if provided, else ADMIN_PAT.
          SHIKOONET_PAT: ${{ secrets.SHIKOONET_PAT }}
          ADMIN_PAT: ${{ secrets.ADMIN_PAT }}
        run: |
          set -e
          rm -rf /tmp/shikoonet /tmp/shikoonet.absent
          if [ -z "$SHIKOONET_REPO" ]; then
            echo "SHIKOONET_REPO is empty -> nothing to fetch; the gate will say out of scope"
            touch /tmp/shikoonet.absent
            exit 0
          fi
          tok="${SHIKOONET_PAT:-$ADMIN_PAT}"
          if [ -z "$tok" ]; then
            echo "::error::Cannot read $SHIKOONET_REPO: neither SHIKOONET_PAT nor"
            echo "::error::ADMIN_PAT is set, and the repo is private. The inventory"
            echo "::error::gate cannot be evaluated; skipping it would move DNS"
            echo "::error::without confirming the commit exists."
            exit 1
          fi
          # A credential helper that lives for this one command. A token
          # inside the URL would land in .git/config, remotes and error
          # messages — CLAUDE.md forbids exactly that.
          tokf=$(mktemp); chmod 600 "$tokf"; printf '%s' "$tok" > "$tokf"
          if ! git -c "credential.helper=!f() { echo username=x-access-token; echo password=$(cat $tokf); }; f" \
                 clone --depth 1 --quiet "$SHIKOONET_REPO" /tmp/shikoonet; then
            rm -f "$tokf"
            echo "::error::clone of shikoonet failed. The token in use cannot read"
            echo "::error::that repository — a fine-grained PAT scoped to change-ip"
            echo "::error::alone will not (and cannot: one resource owner per PAT)."
            echo "::error::Set SHIKOONET_PAT to a token owned by that repo's owner."
            exit 1
          fi
          rm -f "$tokf"
      - name: Is this node in shikoonet's inventory?
        id: in_scope
        if: steps.decide.outputs.dns_scope == 'records'
        env:
          NEW_IP: ${{ needs.swap.outputs.new_ip }}
          OLD_IP: ${{ needs.swap.outputs.old_ip }}
        run: |
          set -e
          # Two facts, ASSIGNED in the shell scope — an earlier version only
          # echoed one and the DNS half was skipped on every rotation:
          #   fleet    = the inventory names this box (either address), so
          #              `make ip-change` is how its DNS moves;
          #   in_scope = it names the NEW address, so the human commit exists.
          # Not a fleet node at all means hand-made records with no inventory
          # line — the tool PATCHes those itself from the manifest.
          in_scope=false; fleet=false
          inv=/tmp/shikoonet/inventory/hosts.yml
          if [ -e /tmp/shikoonet.absent ]; then
            echo "no shikoonet checkout -> not a fleet node"
          else
            grep -q -- "$NEW_IP" "$inv" && in_scope=true
            { grep -q -- "$NEW_IP" "$inv" || grep -q -- "$OLD_IP" "$inv"; } && fleet=true
            echo "$inv: names the new address=$in_scope, fleet node=$fleet"
          fi
          echo "in_scope=$in_scope" >> "$GITHUB_OUTPUT"
          echo "fleet=$fleet" >> "$GITHUB_OUTPUT"
      # Records point at the old address and the node is NOT in the inventory:
      # the human commit is missing. This is the gate the whole CD design
      # keeps on purpose. It fails; it does not skip.
      - name: Refuse — records exist but the inventory commit is missing
        if: steps.decide.outputs.dns_scope == 'records'
            && steps.in_scope.outputs.fleet == 'true'
            && steps.in_scope.outputs.in_scope != 'true'
        env:
          NEW_IP: ${{ needs.swap.outputs.new_ip }}
        run: |
          echo "::error::DNS records point at the old address, but $NEW_IP is not in"
          echo "::error::shikoonet's inventory/hosts.yml. Commit the inventory change,"
          echo "::error::then dispatch 'resume' — or roll back. Nothing was moved."
          exit 1
      - name: Resume the rotation in shikoonet
        if: steps.decide.outputs.dns_scope == 'records' && steps.in_scope.outputs.in_scope == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          # The Cloudflare tokens live ONLY on this step. They are present
          # in the env only when:
          #   1. inputs.operation == 'change-ip' (the job-level `if:`
          #      gates off provider-only entirely)
          #   2. AND the in_scope step confirmed this is a real rotation
          #      (the step-level `if:` gates off throwaway test servers)
          # Both gates are positive (`==`) so a broken token never
          # reaches the env via a falsy short-circuit.
          #
          # ALL THREE NAMES, because the config decides which one is read.
          # `cloudflare.accounts` names a `token_env` per account and the
          # adapter copies THAT variable into the subprocess; a legacy
          # single-account config uses CLOUDFLARE_API_TOKEN. Referencing only
          # the legacy name — as this did until 2026-09-08 — meant the first
          # live change-ip would swap the address and then die on an empty
          # token, leaving the box moved and DNS behind. Unset names expand
          # to empty and are simply never selected.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ACCOUNT_A: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_A }}
          CLOUDFLARE_API_TOKEN_ACCOUNT_B: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_B }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          install -m 600 -D /dev/null ~/.vault_pass_pasarguard
          printf '%s\n' "$VAULT_PASSWORD" > ~/.vault_pass_pasarguard
          printf 'yes\n' | python3 .github/scripts/stage.py \
            --expect-rc 0 \
            --expect-state done \
            --txid "$TXID" \
            --label "dns.hcloud_resume" \
            -- python3 rotate.py resume --config rotation.yml \
              --txid "$TXID" --confirm-server-id "${{ inputs.server_id }}"
      # ---- records exist and this is NOT a shikoonet node -------------------
      # Hand-made records on a box with no inventory line: nothing to commit,
      # no playbook to run, and skipping would leave a domain pointing at an
      # address about to be released. rotate.py records that the INVENTORY
      # half is out of scope — refusing if the inventory names either address,
      # because that is a fleet node whose commit is missing — and then
      # resumes. The PATCH is its own `cloudflare_replaced` step against the
      # manifest built at preflight, each record through the token of the
      # account that discovered it, read back afterwards.
      - name: Move DNS directly (records exist, node is not in shikoonet)
        if: steps.decide.outputs.dns_scope == 'records' && steps.in_scope.outputs.fleet == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ACCOUNT_A: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_A }}
          CLOUDFLARE_API_TOKEN_ACCOUNT_B: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_B }}
        run: |
          set -e
          inv=""
          test -f /tmp/shikoonet/inventory/hosts.yml \
            && inv="--inventory /tmp/shikoonet/inventory/hosts.yml"
          python3 rotate.py declare-ansible-out-of-scope --config rotation.yml \
            --txid "$TXID" --confirm-server-id "${{ inputs.server_id }}" $inv
          python3 .github/scripts/stage.py \
            --expect-rc 0 \
            --expect-state done \
            --txid "$TXID" \
            --label "dns.hcloud_direct" \
            -- python3 rotate.py resume --config rotation.yml \
              --txid "$TXID" --confirm-server-id "${{ inputs.server_id }}"
      # ---- the change-ip release ---------------------------------------------
      # Same guards as the provider-only one, but the finish line here is
      # `done` and can only be reached after a non-empty preflight manifest
      # was applied and verified.
      # rotate.py refuses unless the checkpoint is done, the server is re-read
      # on the new address, and the old Primary IP is re-read as the same
      # address attached to nothing. success() means nothing before it failed.
      - name: Release the old address (retention=release, change-ip)
        if: success() && (steps.in_scope.outputs.in_scope == 'true'
            || steps.in_scope.outputs.fleet == 'false')
        run: |
          set -e
          retention=$(python3 -c "import yaml;print((yaml.safe_load(open('rotation.yml')).get('old_ip') or {}).get('retention','keep'))")
          echo "old_ip.retention = $retention"
          if [ "$retention" != "release" ]; then
            echo "keep: the old address stays retained. Nothing deleted."
            exit 0
          fi
          python3 rotate.py release-old-ip --config rotation.yml \
            --txid "$TXID" --confirm-server-id "${{ inputs.server_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rotation-state-final, path: state/, retention-days: 3}

  # 3'. dns-scan — READ-ONLY. "What in DNS still points at this address?"
  #
  #      The question that had no tool. After a provider-only rotation the
  #      box has moved and DNS has not; before releasing a Primary IP you
  #      need to know nothing still resolves to it, because Hetzner can hand
  #      a released address to another customer. Guessing is not an answer
  #      and neither is a `dig` of the names you happen to remember.
  #
  #      `discover` with `scan_only=true` and an empty allow-list: no floor,
  #      no PATCH, no manifest consumed. It asks each zone the token can see
  #      for A records whose content is the address, and writes the list.
  #      Both accounts are scanned in separate steps so each token only ever
  #      sees its own zones.
  #
  #      This job CANNOT change DNS. The playbook's only mutating verb is
  #      PATCH, reached from `apply` and `rollback`; `discover` is GET-only.
  dns_scan:
    name: DNS scan · what still points at an address (read-only)
    if: inputs.operation == 'dns-scan'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 15
    env:
      SEARCH_IP: ${{ inputs.server_ip }}
    steps:
      - uses: actions/checkout@v4
      # No expect_ipv4 here, deliberately. A scan asks about an address the
      # config may no longer name — after a rotation, the interesting address
      # is precisely the one the config has stopped pointing at.
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
      - name: Scan account A
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_A }}
        run: |
          set -e
          # Extra vars via a JSON file, not -e key=value: the allow-list and
          # manifest are JSON strings and ansible's -e parser splits unquoted
          # values on commas. A file has no quoting to get wrong.
          python3 - <<'PY' > /tmp/ev-a.json
          import json, os
          print(json.dumps({
              "operation": "discover",
              "scan_only": True,
              "invocation_id": "dns-scan-a-" + os.environ["GITHUB_RUN_ID"],
              "result_file": "/tmp/scan-account-a.json",
              "old_ip": os.environ["SEARCH_IP"],
              "new_ip": os.environ["SEARCH_IP"],
              "allowed_records": "[]",
              "expected_count": 0,
              "manifest": "[]",
          }))
          PY
          ansible-playbook cloudflare_replace_ip_step.yml -e @/tmp/ev-a.json
        # SEARCH_IP is read from the env, never interpolated into the shell.
      - name: Scan account B
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_B }}
        run: |
          set -e
          python3 - <<'PY' > /tmp/ev-b.json
          import json, os
          print(json.dumps({
              "operation": "discover",
              "scan_only": True,
              "invocation_id": "dns-scan-b-" + os.environ["GITHUB_RUN_ID"],
              "result_file": "/tmp/scan-account-b.json",
              "old_ip": os.environ["SEARCH_IP"],
              "new_ip": os.environ["SEARCH_IP"],
              "allowed_records": "[]",
              "expected_count": 0,
              "manifest": "[]",
          }))
          PY
          ansible-playbook cloudflare_replace_ip_step.yml -e @/tmp/ev-b.json
      # stdout, NOT $GITHUB_STEP_SUMMARY. tests/contract.yml bans every summary
      # write in this workflow so that no future step can echo a token onto a
      # surface anyone with read access can see. The ban is a bright line and
      # bright lines only work without exceptions — including this one, whose
      # content is merely DNS names.
      - name: What points at it
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, sys
          ip = os.environ["SEARCH_IP"]
          rows, failed = [], []
          for acct, path in (("A", "/tmp/scan-account-a.json"),
                             ("B", "/tmp/scan-account-b.json")):
              try:
                  with open(path) as fh:
                      res = json.load(fh)
              except (OSError, ValueError):
                  failed.append(acct)
                  continue
              # A result file that exists but says ok=false is a failed scan
              # too, not an empty one.
              if not res.get("ok", False):
                  failed.append(acct)
                  continue
              for r in res.get("manifest", []):
                  rows.append((acct, r["name"], r["zone_name"]))
          print(f"### DNS records pointing at `{ip}`\n")
          if failed:
              # A scan that did not run is NOT a scan that found nothing.
              # This step once printed "Nothing ... releasing it strands
              # nothing" after both scans had died on an empty token — a
              # confident, wrong instruction to release an address. No
              # conclusion is the only honest output here, and the job
              # stays red so nobody reads green as "checked".
              print(f"SCAN INCOMPLETE — account(s) {', '.join(failed)} did "
                    "not produce a result. NOTHING can be concluded about "
                    "this address. Do not release it on the strength of "
                    "this run.")
              if rows:
                  print(f"\n(Partial: {len(rows)} record(s) seen in the "
                        "account(s) that did run — a lower bound, not a list.)")
              sys.exit(1)
          if rows:
              print("| account | record | zone |")
              print("|---|---|---|")
              for a, n, z in sorted(rows):
                  print(f"| {a} | `{n}` | {z} |")
              print(f"\n**{len(rows)} record(s).** Releasing this address "
                    "while these exist points them at whoever Hetzner gives "
                    "it to next.")
          else:
              print("Nothing. Both accounts scanned; no A record resolves to "
                    "this address, so releasing it strands nothing.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dns-scan
          path: /tmp/scan-account-*.json
          retention-days: 7
          if-no-files-found: warn

  # 3''. release-old-ip — delete ONE retained Primary IP, by address.
  #
  #      For addresses that predate release existing, or whose checkpoint
  #      artifact has expired. `server_ip` is the address to delete — or the
  #      literal `all-unassigned` to delete EVERY IPv4 Primary IP in the
  #      project that is attached to nothing (added when retained addresses
  #      filled the project's Primary IP quota and allocate began failing). Guards,
  #      each from a fresh read: config must say old_ip.retention: release;
  #      the address must resolve to exactly one Primary IP in the project;
  #      it must be attached to NOTHING. The server's own current address can
  #      never pass the last one. After this there is no rollback to it.
  #
  #      `dns-scan` first. This job does not check DNS; it checks Hetzner.
  release_old_ip:
    name: release · delete a retained Primary IP (by address)
    if: inputs.operation == 'release-old-ip' && inputs.provider == 'hcloud'
    runs-on: ubuntu-latest
    environment: hetzner-production
    timeout-minutes: 15
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      RELEASE_IP: ${{ inputs.server_ip }}
    steps:
      - uses: actions/checkout@v4
      # No expect_ipv4: the address being released is, by definition, not
      # the one the server is on.
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
      - name: Release it
        run: |
          set -e
          retention=$(python3 -c "import yaml;print((yaml.safe_load(open('rotation.yml')).get('old_ip') or {}).get('retention','keep'))")
          echo "old_ip.retention = $retention  address = $RELEASE_IP"
          if [ "$retention" != "release" ]; then
            echo "::error::config says old_ip.retention: $retention — this config never releases."
            exit 1
          fi
          python3 rotate.py release-old-ip --config rotation.yml \
            --ip "$RELEASE_IP" --confirm-server-id "${{ inputs.server_id }}"

  # 4. verify — the checkpoint says done, and says so on its own terms.
  # verify is gated on (a) operation == change-ip (NOT provider-only, NOT
  # a failed/skipped DNS) and (b) dns succeeded. Running after a failed
  # dns with `always()` would have meant a green "verify" against a
  # half-applied rotation; the gate below fixes that.
  verify:
    name: 4 · verify the checkpoint says done
    needs: [swap, dns]
    if: inputs.operation == 'change-ip'
        && inputs.provider == 'hcloud'
        && needs.dns.result == 'success'
    runs-on: ubuntu-latest
    # No mutating access — just reads the artifact and the config. Sits on
    # hetzner-plan because that's where ROTATION_CONFIG lives; without an
    # environment, secrets.ROTATION_CONFIG reads from the repo (empty) and the
    # setup step fails with "ROTATION_CONFIG secret is empty" — exactly the
    # failure we just saw on run #42.
    environment: hetzner-plan
    timeout-minutes: 30
    env:
      TXID: ${{ needs.swap.outputs.txid }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
          expect_ipv4: "${{ inputs.server_ip }}"
      - uses: actions/download-artifact@v4
        with: {name: rotation-state-final, path: state/}
      - run: python3 rotate.py status --config rotation.yml --txid "$TXID"
      - run: |
          python3 - <<'EOF'
          import json, os, sys
          cp = json.load(open(f"state/{os.environ['TXID']}.json"))
          if cp.get("outcome") != "done":
              sys.exit(f"outcome is {cp.get('outcome')!r}, not 'done'")
          fate = ("was RELEASED — deleted from Hetzner"
                  if cp["old_ip"].get("retention") == "released"
                  else "is unassigned and RETAINED")
          print(f"{cp['server']['expected_name']} is on {cp['new_ip']['ip']}; "
                f"{cp['old_ip']['ip']} {fate}.")
          EOF
      - run: |
          echo "Now run 'make monitoring-doctor' in the shikoonet repo. It is the"
          echo "only thing that notices a node that is up but silently unmonitored."

  # ===========================================================================
  # operation: finalize — DataForest only: release OLD_IP from the Seed.
  #
  # Point-of-no-return. DataForest does not guarantee reacquisition of a
  # released IPv4. The operator dispatches this as a separate workflow
  # run; no automatic dependency reaches it.
  #
  # Two jobs, each pinned to its own protected environment. A GitHub
  # job can reference exactly one environment, and the OLD_IP release
  # is structurally two stages:
  #   1. cloudflare-finalize-precheck (cloudflare-production) re-reads
  #      both accounts' DNS against the persisted manifest, persists a
  #      token-free `dns_finalize_verified` marker. Carries only the
  #      two Cloudflare account tokens; no DataForest token.
  #   2. dataforest-provider-finalize (dataforest-production) reads
  #      that marker, validates the digest + txid + seed_id, then
  #      runs seed.remove-ipv4. Carries only DATAFOREST_API_TOKEN; no
  #      Cloudflare token.
  #
  # `finalize` is the only operation that may legitimately release
  # the burned address. `change-ip`, `provider-only`, and `rollback`
  # MUST all refuse it.
  # ===========================================================================
  cloudflare_finalize_precheck:
    name: finalize · Cloudflare DNS read-back (two-account, CF production)
    if: inputs.operation == 'finalize' && inputs.provider == 'dataforest'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 30
    outputs:
      txid: ${{ steps.pick.outputs.txid }}
    env:
      # Two-account Cloudflare ONLY. No legacy CLOUDFLARE_API_TOKEN
      # alias. The two-step precheck writes a fresh
      # `dns_finalize_verified` marker the provider step consumes;
      # the marker carries the digest, NOT the token values.
      CLOUDFLARE_API_TOKEN_ACCOUNT_A: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_A }}
      CLOUDFLARE_API_TOKEN_ACCOUNT_B: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_B }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
          expect_ipv4: "${{ inputs.server_ip }}"
      - uses: actions/download-artifact@v4
        with: {name: rotation-state, path: state/}
      - name: Refuse if no checkpoint
        run: |
          test -n "$(ls state/*.json 2>/dev/null)" || {
            echo "no rotation-state artifact found; run a change-ip first";
            exit 1;
          }
      - id: pick
        name: Pick the awaiting_finalize txid
        run: |
          TXID=$(ls -t state/*.json | head -1 | xargs -n1 basename | sed 's/\.json$//')
          STATE=$(python3 -c "import json;print(json.load(open('state/$TXID.json'))['state'])")
          test "$STATE" = "awaiting_finalize" || {
            echo "checkpoint state is '$STATE'; finalize must run from awaiting_finalize";
            exit 11;
          }
          echo "txid=$TXID" >> "$GITHUB_OUTPUT"
      - name: finalize precheck · Cloudflare DNS read-back (two-account)
        run: |
          python3 .github/scripts/stage.py \
            --expect-rc 6 \
            --expect-state dns_finalize_verified \
            --expect-marker dns_finalize_verified \
            --txid "${{ steps.pick.outputs.txid }}" \
            --label "finalize.precheck" \
            -- python3 rotate.py finalize-precheck \
              --config rotation.yml \
              --txid "${{ steps.pick.outputs.txid }}" \
              --confirm-server-id "${{ inputs.server_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rotation-state-prechecked, path: state/, retention-days: 3}

  dataforest_provider_finalize:
    name: finalize · release OLD_IP (DataForest production)
    if: inputs.operation == 'finalize' && inputs.provider == 'dataforest'
    needs: [cloudflare_finalize_precheck]
    runs-on: ubuntu-latest
    environment: dataforest-production
    timeout-minutes: 30
    env:
      # DataForest token ONLY. No Cloudflare token in scope; the
      # marker persisted by the precheck job is the contract.
      DATAFOREST_API_TOKEN: ${{ secrets.DATAFOREST_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
          expect_ipv4: "${{ inputs.server_ip }}"
      - uses: actions/download-artifact@v4
        with: {name: rotation-state-prechecked, path: state/}
      - name: finalize provider · release OLD_IP (DF token only)
        run: |
          python3 .github/scripts/stage.py \
            --expect-rc 0 \
            --expect-state done \
            --expect-marker old_ip_removed \
            --expect-marker dns_finalize_verified \
            --txid "${{ needs.cloudflare_finalize_precheck.outputs.txid }}" \
            --label "finalize.provider" \
            -- python3 rotate.py provider-finalize \
              --config rotation.yml \
              --txid "${{ needs.cloudflare_finalize_precheck.outputs.txid }}" \
              --confirm-server-id "${{ inputs.server_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rotation-state-finalized, path: state/, retention-days: 3}

  # ===========================================================================
  # operation: rollback — puts the OLD address back.
  #
  # Never automatic. GitLab keeps a finished pipeline's manual jobs clickable;
  # GitHub does not — a run that ended has no button left. So this one finds
  # the transaction itself: the newest unexpired checkpoint artifact in the
  # repo, then proves it is the box the operator meant before touching it.
  #
  # A node that is up on the new address is not an emergency, and swapping back
  # does not fix a box that will not boot. Read the checkpoint first:
  #   gh run download <run_id> -n rotation-state && python3 rotate.py status --txid <txid>
  #
  # The NEW address is RETAINED after a rollback. Deleting it is a separate
  # decision with a separate approval.
  # ===========================================================================
  rollback:
    name: roll back to the old IP
    if: inputs.operation == 'rollback' && inputs.provider == 'hcloud'
    runs-on: ubuntu-latest
    environment: hetzner-production
    timeout-minutes: 30
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      # CLOUDFLARE_API_TOKEN is intentionally absent at the job level.
      # The DNS rollback step below carries it ONLY when the checkpoint
      # indicates DNS recovery is required. A provider rollback that
      # never touched Cloudflare skips that step entirely, and the
      # token never enters this process.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
      - name: Find the last transaction
        id: pick
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The operator is not asked for a txid. Typing one is a chance to
          # mistype one, and the answer is already in the artifacts: the newest
          # unexpired checkpoint IS the transaction to roll back.
          #
          # We need the run-id of the workflow_run that produced the artifact,
          # because actions/download-artifact defaults to THIS run's artifacts.
          # Without an explicit run-id, it sees nothing.
          python3 - <<'EOF'
          import json, os, sys, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          h = {"Authorization": f"Bearer {token}",
               "Accept": "application/vnd.github+json"}

          arts = json.loads(urllib.request.urlopen(urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100",
              headers=h)).read())["artifacts"]
          live = [a for a in arts
                  if not a["expired"] and a["name"].startswith("rotation-state")]
          if not live:
              sys.exit("No checkpoint artifact left. They expire after 30 days; "
                       "past that a rollback is done by hand from the console.")
          # Always take the newest checkpoint. A failed staged rollback emits
          # rotation-state-rolledback after rotation-state-final; preferring
          # every older "-final" artifact would discard provider recovery.
          art = max(live, key=lambda a: a["created_at"])
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ARTIFACT_NAME={art['name']}\n")
              f.write(f"ARTIFACT_RUN_ID={art['workflow_run']['id']}\n")
          print(f"will restore {art['name']} from run {art['workflow_run']['id']}.")
          EOF
      - name: Download the checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: state/
          github-token: ${{ github.token }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
      - name: Refuse without a checkpoint
        run: |
          test -n "$(ls state/*.json 2>/dev/null)" || {
            echo "No rotation-state* artifact found. They expire after 30 days;"
            echo "past that a rollback is done by hand from the console."
            exit 1; }
      - name: Prove it is the box you meant
        id: cp
        env:
          SERVER_ID: ${{ inputs.server_id }}
          SERVER_IP: ${{ inputs.server_ip }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import glob, json, os, sys
          files = sorted(glob.glob("state/*.json"), key=os.path.getmtime)
          if not files:
              sys.exit("the artifact held no checkpoint")
          cp = json.load(open(files[-1]))
          txid = cp["txid"]
          # Two independent facts, both from the operator, both re-proved
          # against the checkpoint before anything is powered off. The address
          # typed on the form is the one the box is sitting on NOW — after a
          # swap that is the NEW one.
          if str(cp["server"]["id"]) != os.environ["SERVER_ID"].strip():
              sys.exit(f"{txid} is server {cp['server']['id']}, you typed "
                       f"{os.environ['SERVER_ID']}. Wrong transaction.")
          rollback = cp.get("rollback") or {}
          provider_is_back = rollback.get("state") in {
              "rolled_back", "rollback_incomplete"
          }
          now = (cp["old_ip"]["ip"] if provider_is_back else
                 ((cp.get("new_ip") or {}).get("ip") or cp["old_ip"]["ip"]))
          if now != os.environ["SERVER_IP"].strip():
              sys.exit(f"{txid} left the box on {now}, you typed "
                       f"{os.environ['SERVER_IP']}. Read it before rolling back.")
          print(f"txid={txid}")
          EOF
      - run: python3 rotate.py status --config rotation.yml --txid "${{ steps.cp.outputs.txid }}"
      # Provider half only — no Cloudflare token. The DNS step below is
      # gated on the checkpoint showing DNS recovery is required.
      - name: Roll back the provider IP
        run: |
          python3 .github/scripts/stage.py \
            --expect-rc 5 \
            --expect-state needs_rollback \
            --txid "${{ steps.cp.outputs.txid }}" \
            --label "rollback.hcloud_provider" \
            -- python3 rotate.py rollback --config rotation.yml \
              --txid "${{ steps.cp.outputs.txid }}" \
              --confirm-server-id "${{ inputs.server_id }}" \
              --no-dns-rollback
      # Decide from the checkpoint whether DNS recovery is required. This
      # is a positive check (==) on a real field; no falsy-ternary trick.
      - name: Decide whether DNS rollback is required
        id: need_dns
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import glob, json, os
          files = sorted(glob.glob("state/*.json"), key=os.path.getmtime)
          cp = json.load(open(files[-1]))
          needs_dns = (
              cp.get("cloudflare_apply_started") is not None
              or cp.get("cloudflare_apply") is not None
              or ((cp.get("ansible") or {}).get("rc") == 0)
          )
          print(f"needs_dns_rollback={'true' if needs_dns else 'false'}")
          EOF
      # The DNS rollback step. CLOUDFLARE_API_TOKEN lives ONLY here.
      # The gate is a positive == on the previous step's output. When
      # the previous step set needs_dns_rollback=false, this step is
      # skipped, the token is never exported, and the env block is
      # never evaluated against `secrets.CLOUDFLARE_API_TOKEN`.
      # All three names for the same reason as the dns job: the config
      # chooses which is read. A rollback that could not reach Cloudflare
      # would fail at the worst possible moment — the address is already
      # back and DNS is the half still pointing at the wrong box.
      - name: Roll back the DNS records
        if: steps.need_dns.outputs.needs_dns_rollback == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ACCOUNT_A: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_A }}
          CLOUDFLARE_API_TOKEN_ACCOUNT_B: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_B }}
        run: |
          python3 .github/scripts/stage.py \
            --expect-rc 5 \
            --expect-state rolled_back \
            --txid "${{ steps.cp.outputs.txid }}" \
            --label "rollback.hcloud_dns" \
            -- python3 rotate.py rollback --config rotation.yml \
              --txid "${{ steps.cp.outputs.txid }}" \
              --confirm-server-id "${{ inputs.server_id }}" \
              --dns-rollback-only
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rotation-state-rolledback, path: state/, retention-days: 3}

  # -----------------------------------------------------------------------------
  # operation: rollback for DataForest. The Hetzner rollback restores the
  # OLD IP to the server; the DataForest rollback removes the NEW_IP from
  # the Seed and reverts DNS / inventory / guest to OLD_IP. The same
  # never-acquire-OLD-IP-back guarantee applies.
  # -----------------------------------------------------------------------------
  rollback_dataforest:
    name: DataForest rollback (release NEW_IP, revert guest + DNS in isolated stages)
    if: inputs.operation == 'rollback' && inputs.provider == 'dataforest'
    runs-on: ubuntu-latest
    environment: dataforest-production
    timeout-minutes: 30
    env:
      # Job-level: GH_TOKEN only. The DNS step adds the CF token
      # at step scope; the provider step adds DATAFOREST_API_TOKEN
      # at step scope. Neither token is in the JOB env, so a
      # process that runs only the job's env sees no production
      # secret.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rotation_config: "${{ secrets.ROTATION_CONFIG }}"
      - name: Find the last DataForest transaction
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          h = {"Authorization": f"Bearer {token}",
               "Accept": "application/vnd.github+json"}
          arts = json.loads(urllib.request.urlopen(urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100",
              headers=h)).read())["artifacts"]
          live = [a for a in arts
                  if not a["expired"] and a["name"].startswith("rotation-state")]
          if not live:
              sys.exit("no rotation-state artifact; nothing to roll back")
          finals = [a for a in live if a["name"].endswith("-finalized")]
          art = max(finals or live, key=lambda a: a["created_at"])
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"ARTIFACT_NAME={art['name']}\n")
              f.write(f"ARTIFACT_RUN_ID={art['workflow_run']['id']}\n")
          EOF
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: state/
          github-token: ${{ github.token }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
      - name: Pick the rollback txid
        id: pick
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import glob, json, os
          files = sorted(glob.glob("state/*.json"), key=os.path.getmtime)
          cp = json.load(open(files[-1]))
          print(f"txid={cp['txid']}")
          EOF
      # Decide from the checkpoint whether DNS rollback is required. This
      # is a positive check (==) on a real field; no falsy-ternary trick.
      - name: Decide whether DNS rollback is required
        id: need_dns
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import glob, json, os
          files = sorted(glob.glob("state/*.json"), key=os.path.getmtime)
          cp = json.load(open(files[-1]))
          needs_dns = (
              cp.get("cloudflare_apply_started") is not None
              or cp.get("cloudflare_apply") is not None
              or ((cp.get("ansible") or {}).get("rc") == 0)
          )
          print(f"needs_dns_rollback={'true' if needs_dns else 'false'}")
          EOF
      # The DNS rollback step. CLOUDFLARE_API_TOKEN lives ONLY here.
      # The DataForest provider step below MUST NOT see it.
      - name: Roll back DNS (CF token only)
        if: steps.need_dns.outputs.needs_dns_rollback == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ACCOUNT_A: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_A }}
          CLOUDFLARE_API_TOKEN_ACCOUNT_B: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT_B }}
        run: |
          python3 .github/scripts/stage.py \
            --expect-rc 5 \
            --expect-state rolled_back \
            --txid "${{ steps.pick.outputs.txid }}" \
            --label "rollback.dns" \
            -- python3 rotate.py rollback-dns --config rotation.yml \
              --txid "${{ steps.pick.outputs.txid }}" \
              --confirm-server-id "${{ inputs.server_id }}"
      # Inventory rollback — no token.
      - name: Roll back inventory (no token)
        run: |
          python3 .github/scripts/stage.py \
            --expect-rc 5 \
            --expect-state rolled_back \
            --txid "${{ steps.pick.outputs.txid }}" \
            --label "rollback.inventory" \
            -- python3 rotate.py rollback-inventory --config rotation.yml \
              --txid "${{ steps.pick.outputs.txid }}" \
              --confirm-server-id "${{ inputs.server_id }}"
      # Guest rollback — no token.
      - name: Roll back guest (no token)
        run: |
          python3 .github/scripts/stage.py \
            --expect-rc 5 \
            --expect-state rolled_back \
            --txid "${{ steps.pick.outputs.txid }}" \
            --label "rollback.guest" \
            -- python3 rotate.py rollback-guest --config rotation.yml \
              --txid "${{ steps.pick.outputs.txid }}" \
              --confirm-server-id "${{ inputs.server_id }}"
      # Provider rollback — DF token only. The CF token MUST NOT be in
      # scope; the CLI refuses if it is.
      - name: Provider rollback (DF token only, release NEW_IP)
        env:
          DATAFOREST_API_TOKEN: ${{ secrets.DATAFOREST_API_TOKEN }}
        run: |
          python3 .github/scripts/stage.py \
            --expect-rc 5 \
            --expect-state rolled_back \
            --expect-marker rollback_dns_step_at \
            --txid "${{ steps.pick.outputs.txid }}" \
            --label "rollback.provider" \
            -- python3 rotate.py rollback-provider --config rotation.yml \
              --txid "${{ steps.pick.outputs.txid }}" \
              --confirm-server-id "${{ inputs.server_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: rotation-state-rolledback-dataforest, path: state/, retention-days: 3}
