---
# =============================================================================
# bootstrap — bring this repo's Actions configuration to the state a live
# rotation needs, FROM GITHUB. Nothing is typed on anyone's laptop.
#
# It runs scripts/setup-secrets.sh on a runner: creates any missing
# environment, installs the required reviewers, and re-syncs the secrets whose
# values live in the shikoonet Ansible vault. The same script runs locally;
# there is one implementation, not a copy that drifts.
#
# ⚠ THE ONE THING THAT CANNOT BE AUTOMATED
#
# `GITHUB_TOKEN` has no `secrets:write` scope and none can be granted, so no
# workflow can install a secret — including this one. It needs a Personal
# Access Token with `repo` scope, stored as the secret `ADMIN_PAT`.
#
# Add ADMIN_PAT once, through the GitHub web UI:
#   Settings → Environments → hetzner-production → Add environment secret
# That is a form, not a command, and it is the last manual act. Every secret
# after it is installed by this workflow.
#
# Run with `mode: report` first. It writes nothing and prints what it would do.
# =============================================================================
name: bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = show what would change, nothing written. apply = do it.'
        required: true
        type: choice
        default: report
        options:
          - report
          - apply

# Read-only for the default token. The PAT below is what writes, and only
# where the script uses it.
permissions:
  contents: read

jobs:
  bootstrap:
    name: configure environments, reviewers and secrets
    runs-on: ubuntu-latest
    # Gated: this job can rewrite every secret in the repo. It sits behind the
    # same reviewer as a rotation, for the same reason.
    environment: hetzner-production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install ansible-core (for ansible-vault)
        run: pip install --quiet --disable-pip-version-check ansible-core pyyaml

      - name: Refuse without ADMIN_PAT, and say why
        env:
          ADMIN_PAT: ${{ secrets.ADMIN_PAT }}
        run: |
          if [ -z "$ADMIN_PAT" ]; then
            cat <<'MSG'
          ADMIN_PAT is not set on this environment.

          GITHUB_TOKEN cannot write Actions secrets. The scope does not exist
          for it and cannot be granted — deliberately, because a workflow that
          could write secrets would let anyone able to merge code overwrite
          every credential in the repo. So one token has to come from outside.
          This is that token, and it is the only manual step left.

          MAKE IT (fine-grained, so it reaches this repo and nothing else):

            1. github.com/settings/personal-access-tokens/new
            2. Token name:        change-ip-bootstrap
               Resource owner:    Shikoonet
               Expiration:        90 days
               Repository access: Only select repositories
                                  -> Shikoonet/change-ip
               Permissions -> Repository permissions:
                 Secrets       -> Read and write
                 Environments  -> Read and write
               (leave everything else alone)
            3. Generate token, copy it — it is shown once.

          INSTALL IT:

            github.com/Shikoonet/change-ip/settings/environments
              -> hetzner-production -> Add environment secret
                 Name:  ADMIN_PAT
                 Value: the token

          If Shikoonet is an organisation, a fine-grained token may need org
          approval. A classic token from github.com/settings/tokens/new with
          the `repo` scope also works, at the cost of much wider access.

          Then dispatch this workflow again with mode: report.
          MSG
            exit 1
          fi
          echo "ADMIN_PAT present."

      - name: Run the bootstrap
        env:
          # The PAT is what gh authenticates with. It is scoped to this step.
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
          REPO: ${{ github.repository }}
          # Sources the script materialises into files on the runner. All are
          # already secrets here; none is echoed by the script.
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SHIKOONET_REPO: ${{ secrets.SHIKOONET_REPO }}
          ROTATION_CONFIG: ${{ secrets.ROTATION_CONFIG }}
          # Reviewer to install on any environment that lacks one. Defaults to
          # the PAT's own identity, which is the operator.
          REVIEWER_ID: ${{ vars.REVIEWER_ID }}
        run: |
          set -e
          if [ "${{ inputs.mode }}" = "report" ]; then
            bash scripts/setup-secrets.sh --dry
          else
            bash scripts/setup-secrets.sh
          fi
