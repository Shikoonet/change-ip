---
# =============================================================================
# server-ip-rotation — example config. PLACEHOLDERS ONLY, no real values.
#
#   cp rotation.example.yml rotation.yml     # rotation.yml is gitignored
#   $EDITOR rotation.yml                     # fill in the four server.* values
#   export HCLOUD_TOKEN=...                  # see README.md
#   python3 rotate.py plan --config rotation.yml
#
# There is no secret in this file and there must never be one. The API token is
# read from the HCLOUD_TOKEN environment variable by the hcloud modules
# themselves — it appears in no config, no argv and no checkpoint.
# =============================================================================

provider: hcloud

# Printed by `plan` as "project <12 hex chars>": the first 12 chars of
# sha256(HCLOUD_TOKEN). Pin it here after the first plan and every later run
# asserts against it. That is what stops a rotation started against production
# from being resumed with a staging token still exported in the shell — the
# token itself is not recoverable from this value.
# Leave empty to skip the check (only reasonable before the very first plan).
project_fingerprint: ""

# === Provider selection =================================================
# Two providers ship in this repo:
#
#   provider: hcloud        — Hetzner Cloud. The original flow. stop/detach/
#                             attach/start around a server power-cycle.
#                             `old_ip.retention` keeps the burned address;
#                             nothing is deleted by this tool.
#
#   provider: dataforest    — DataForest Seed. Two-phase cutover: the Seed
#                             keeps both addresses throughout, NEW_IP is
#                             bound at runtime + persistently, and OLD_IP
#                             release is a separate explicit `finalize`
#                             command (point of no return — DataForest
#                             does not guarantee reacquisition of a
#                             released IPv4).
#
# The state machine, the checkpoint format, the Cloudflare half, and the
# `make ip-change HOST=<alias>` half are shared. The provider-specific
# keys below are required when provider=dataforest and ignored otherwise.
# =============================================================================

server:
  # For provider=hcloud, the IMMUTABLE numeric id, read once from the
  # Hetzner Cloud console (Servers -> the server -> the number in the URL).
  # Not the name: a name can be changed by anyone with console access, an
  # id cannot.
  #
  # For provider=dataforest, the IMMUTABLE Seed UUID. Display names are
  # not used as identity; if the Seed's display name does not match
  # `seed.expected_name` the run stops before any mutation.
  id: 0
  # What a fresh read must say before ANY mutation. The id is the immuta-
  # ble identity; the expected_* values are what every identity assert
  # compares against.
  expected_name: "Hetzner-DE"
  expected_ipv4: "203.0.113.10"
  expected_location: "nbg1"

# DataForest-specific section. Required when provider=dataforest.
seed:
  expected_name: "seed-default"
  expected_location: "fra1"
  # Optional. If present, must match the Seed's project.
  expected_project: "default"
  # Any address on the Seed beyond OLD_IP that is allowed without
  # failing preflight. Empty by default — a third address is a stop.
  allow_extra_addresses: []

# Guest network configuration. Required when provider=dataforest.
guest:
  # One of: netplan, systemd-networkd, networkmanager, ifupdown.
  # Anything else is fail-closed.
  network_manager: "netplan"
  # The primary interface on the Seed. Strict-validated; no shell injection.
  interface: "eth0"
  # Regex the SSH host key returned by `ssh-keyscan NEW_IP` must match.
  # The pattern is matched against the full keyscan stdout.
  expected_host_key_pattern: "^[^ ]+ ssh-ed25519"
  # Optional explicit gateway. Default: derive from OLD_IP's existing
  # ipv4 entry on the Seed. Refuse if neither is set.
  gateway: ""
  # TCP probes to run on NEW_IP after configure_guest. Each entry:
  # {name: str, port: int, timeout: int (seconds)}
  service_probes: []

ansible:
  # The inventory alias. It is what `make ip-change HOST=<alias>` receives and
  # what ip-change.yml gates on twice.
  host_alias: "Hetzner-DE"
  inventory: "inventory/hosts.yml"
  # Where `make` is run: the repo root, relative to THIS file.
  repo_dir: ".."
  # Must stay false. inventory/hosts.yml is the single source of truth and
  # nothing writes to it automatically; `true` is refused, not ignored.
  auto_edit_inventory: false

dns:
  # <alias>.<node_record_zone> is the one record `make ip-change` moves. The
  # public verb name in cf_zone is not in its scope and is not touched.
  node_record_zone: "tinooer.top"
  # The allow-list. The record above must appear here or the run stops at
  # `validated`, before anything is powered off. An empty list is a stop, not
  # a pass — "allowed to change nothing" is the safe reading of silence.
  allowed_records:
    - "Hetzner-DE.tinooer.top"

timeouts:
  power_off: 180
  power_on: 300
  # One TCP handshake against the new address. Not an SSH auth attempt: this
  # runs seconds after a boot and the question is "is the address live".
  ssh: 10

retries:
  # Retries apply to TRANSIENT failures only; an auth error aborts on the first
  # attempt. During the middle of a rotation the node is off, so every wasted
  # retry is real downtime.
  provider: 3
  provider_delay: 10
  # 30 x 10s = five minutes for the box to finish booting.
  health: 30
  health_delay: 10

old_ip:
  # `keep` is the only implemented value and the only one that will ever be
  # accepted without a separate decision. The previous address is unassigned
  # and RETAINED — it is still billed, and removing it is your call.
  retention: keep

cloudflare:
  # All A records this rotation is allowed to move, by FQDN. Exactly the
  # ones the preflight discovers in the MANIFEST; apply and rollback touch
  # nothing else. Empty allow-list is a stop, not a pass.
  allowed_records:
    - "Hetzner-DE.tinooer.top"
    - "nurture.miragerunner.com"
  # expected_record_count guards the discover step. If Cloudflare returns
  # fewer matches, the run aborts BEFORE any provider mutation.
  expected_record_count: 8
  # mode: provider_only skips the DNS half entirely and pauses at
  # connectivity_ok. For throwaway test servers that are not in the DNS
  # allow-list. Anything else is a typo and validate_config rejects it.
  mode: null   # full run (or "provider_only" to skip DNS)

health:
  ssh_port: 22

# Finalize configuration. Required when provider=dataforest; ignored
# otherwise. `finalize` releases OLD_IP from the Seed — DataForest does
# not guarantee reacquisition of a released address.
finalize:
  # Must be `true`. False means "I want the tool to silently fail rather
  # than take a point-of-no-return action", which is not what the
  # explicit `finalize` subcommand is for.
  acknowledge_no_reacquire: true
  # PTR policy at finalize time. DataForest exposes PTR metadata but
  # does not document an API to set a replacement PTR. The default is
  # `require_match`: if OLD_IP has a PTR and NEW_IP does not, finalize
  # refuses. `allow_no_ptr` accepts NEW_IP without a PTR.
  ptr_policy: "require_match"

# Checkpoints, relative to this file. Gitignored except for .gitkeep.
state_dir: "state"
