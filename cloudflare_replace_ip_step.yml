---
# =============================================================================
# cloudflare_replace_ip_step.yml — the ONLY file in this repo that talks to
# Cloudflare DNS. Parallel structure to hcloud_step.yml so a reader who already
# knows one knows the other.
#
#   ansible-playbook cloudflare_replace_ip_step.yml \
#       -e operation=apply \
#       -e old_ip=46.224.67.245 \
#       -e new_ip=91.99.11.7 \
#       -e allowed_records='["ne.tinooer.top","nurture.miragerunner.com"]' \
#       -e expected_count=8 \
#       -e invocation_id=<uuid> \
#       -e result_file=/tmp/cf.json \
#       -e manifest='[{"record_id":"...","zone_id":"...","name":"...","previous_content":"..."}]'
#
# Four ops share one play: discover / apply / rollback / verify.
#   * discover — list every zone + every record named in `allowed_records`,
#                read-back current content, write a MANIFEST the later ops reuse.
#   * apply    — PATCH (never DELETE / never POST again) every record in the
#                MANIFEST whose content is OLD_IP -> NEW_IP. Records with any
#                other content (or missing) escalate; an empty patch set is
#                only OK when the read-back proves NEW_IP on every record.
#   * rollback — mirror of apply, OLD_IP = the address we just burned, NEW_IP
#                = the one being put back. Missing / third-party content
#                escalates and sets `rollback_incomplete: true` so a human can
#                read the manifest and finish the remaining ones by hand.
#   * verify   — read every record in MANIFEST, assert content == NEW_IP.
#
# RULES LOAD-BEARING FOR THIS FILE
#
# 1. THE TOKEN NEVER ENTERS PYTHON AND NEVER ENTERS ARGV. Every authenticated
#    request sets `Authorization: Bearer ...` from the env var
#    CLOUDFLARE_API_TOKEN directly inside the playbook. The token therefore
#    appears in no var file, no -e blob, no per-step stdout, and (because of
#    `no_log: true`) no Ansible log either.
#
# 2. NO DELETE, NO POST NEW. Records already exist for this allowlist — if
#    they did not, `discover` would return zero matches and stop. Adding a
#    POST would be how a "round-robin between dead and live IPs" bug reaches
#    production; the contract test asserts no `DELETE` / `["DELETE"]`.
#
# 3. PAGINATION USES `result_info.total_pages`, NEVER `has_more`. Cloudflare's
#    response shape is `total_pages` and a `page` field; `has_more` either
#    crashes (key absent) or lies. Pagination is deterministic:
#    fetch page 1, validate total_pages, then loop `2..total_pages`.
#    Same shape for /zones and /zones/{id}/dns_records.
#
# 4. APPLY AND ROLLBACK TOUCH ONLY MANIFEST RECORDS. The manifest is what
#    was discovered before the box moved, and only those IDs are PATCHed.
#    Anything that drifted after discover aborts. That property is unchanged
#    and is the one that matters.
#
#    DISCOVER, HOWEVER, NOW SCANS. It asks each zone for A records whose
#    content is already OLD_IP (`?type=A&content=<ip>`, filtered server-side)
#    and unions them with the `allowed_records` lookups. `allowed_records` is
#    a FLOOR: every name in it must come back, or preflight stops; records
#    found only by the scan are added on top.
#
#    The earlier version of this note forbade the scan. It was changed on
#    2026-09-08 because a hand-maintained allowlist goes stale exactly the
#    way it did in practice — a record added from a phone was not in the
#    config, so the rotation left it pointing at a dead address. OLD_IP comes
#    from the checkpoint, never from a human, so "points at OLD_IP" is a
#    sound definition of "belongs to this box". Apply still PATCHes only the
#    ids captured before the provider moved anything.
#
# 5. PATCH BODY IS `{"content": TARGET_IP}` ONLY. TTL, proxied, comment, and
#    tags are NOT sent; the operation is an IP replacement, not a record
#    reconfiguration. The fake server must retain original TTL/proxied/etc.
#
# 6. READ-BACK AFTER EVERY PATCH. A PATCH that returned 200 but did not
#    apply shows up only on a fresh GET. The apply block asserts every
#    record's content == new_ip after the loop; the verify op IS that
#    read-back for the post-rotation audit.
#
# 7. NO `ignore_errors:` AND NO `failed_when: false`. Same lesson as
#    hcloud_step.yml: a green-but-failed step here is silent DNS drift.
#
# 8. NO `state: absent`. Rule One — nothing this repo runs deletes a DNS
#    record.
#
# 9. INVOCATION_ID. Every result file carries the caller's invocation_id.
#    A result file from a previous run — or from a different op — is
#    refused at parse time. Without this, a leftover tmpfile from a
#    earlier failed run could be accepted as today's success.
# =============================================================================
- name: "cloudflare dns step"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true

  vars:
    ansible_managed: "Managed by Ansible (server-ip-rotation) - do not write to state by hand"
    _operations:
      - discover
      - apply
      - rollback
      - verify
    cf_api_base: "https://api.cloudflare.com/client/v4"

  tasks:

    - name: "cloudflare | the operation, the invocation id, and the result path are required"
      ansible.builtin.assert:
        that:
          - operation is defined
          - operation in _operations
          - invocation_id is defined
          - (invocation_id | default('', true) | length) > 0
          - result_file is defined
          - (result_file | default('', true) | length) > 0
          - (lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | default('', true) | length) > 0
          - old_ip is defined
          - new_ip is defined
          - allowed_records is defined
          - expected_count is defined
          - manifest is defined
          - operation != 'rollback' or ((allowed_records | from_json) | length) > 0
        fail_msg: >-
          Usage: ansible-playbook cloudflare_replace_ip_step.yml
          -e operation=<discover|apply|rollback|verify>
          -e invocation_id=<uuid>
          -e old_ip=... -e new_ip=... -e allowed_records='["..."]'
          -e expected_count=<n> -e manifest='[ ... ]'
          -e result_file=/path/out.json.
          CLOUDFLARE_API_TOKEN must be exported (it never appears in argv).
          For the per-account path also pass -e credential_ref=<name>
          -e token_env=<env-var-name>; the adapter will copy that env
          var into CLOUDFLARE_API_TOKEN in the subprocess env only.
        quiet: true

    # Per-account assertion: when credential_ref is passed, the manifest
    # MUST be homogeneous (every entry has the same credential_ref). A
    # mixed manifest is a structural error and never reaches a PATCH.
    - name: "cloudflare | manifest is homogeneous per credential_ref"
      ansible.builtin.assert:
        that:
          - (credential_ref is not defined)
            or (((manifest | from_json) | map(attribute='credential_ref', default=None) | unique | length) <= 1)
        fail_msg: >-
          Manifest contains records from more than one credential_ref;
          a single playbook invocation may only carry ONE account's
          subset. Re-run the parent process so the per-account buckets
          are split into separate ansible-playbook calls.
        quiet: true

    # `scan_only` is a DECLARED intent, not a degenerate case of zero. A
    # rotation can never set it: validate_config refuses an empty
    # cloudflare.allowed_records, and rotate.py never passes this var. It
    # exists for one question a human asks by hand — "what still points at
    # this address?" — after a provider-only run, or before releasing an
    # address. It relaxes the FLOOR only; it cannot make apply or rollback
    # touch anything, because those work from the manifest and never re-run
    # discovery.
    - name: "cloudflare | scan_only is discover-only and must be a real boolean"
      ansible.builtin.assert:
        that:
          - (scan_only | default(false)) | bool == false or operation == 'discover'
        fail_msg: >-
          scan_only is only meaningful for `discover`. apply, rollback and
          verify read the manifest that discover already wrote; there is no
          floor left for them to relax.
        quiet: true

    # The floor is DECLARED, so it must match what was declared. Zero is a
    # legitimate declaration — "no named record is required" — because the
    # per-zone content scan is what actually finds records, and a rotation
    # with an empty floor still moves every A record that holds old_ip.
    #
    # This used to refuse zero outright, from the era when the allowlist WAS
    # the whole set and an empty one meant a rotation that silently moved
    # nothing. Under the floor model that reading is gone, and the old guard
    # cost run 34316063764: the first change-ip with a real DNS config
    # escalated here before touching anything.
    - name: "cloudflare | the floor is declared, not guessed"
      ansible.builtin.assert:
        that:
          - expected_count | int >= 0
          - (expected_count | int) == ((allowed_records | from_json) | length)
        fail_msg: >-
          expected_count is {{ expected_count }} but allowed_records names
          {{ (allowed_records | from_json) | length }}. The floor is a
          declaration: the two must agree, or one of them is a typo. Zero on
          both sides is fine and means the content scan alone decides.
        quiet: true
      when: not ((scan_only | default(false)) | bool)

    # --------------------------------------------------------------- API base
    # TWO-MODE CONTRACT — production vs test, NO shared default URL.
    #
    # Production mode (CF_PLAYBOOK_TEST_MODE != "1"):
    #   * cf_api_base unset         → fall back to the official endpoint
    #                                 (the playbook's hard-coded `vars:` value).
    #   * cf_api_base == official   → allowed.
    #   * any other value           → REJECTED.
    #
    # Test mode (CF_PLAYBOOK_TEST_MODE == "1"):
    #   * cf_api_base unset         → REJECTED. A test that forgets to pass a
    #                                 loopback URL would otherwise fall back to
    #                                 the production endpoint and route test
    #                                 traffic to the real Cloudflare API.
    #   * cf_api_base == official   → REJECTED. The whole point of test mode
    #                                 is to NOT call the real API.
    #   * non-loopback URL          → REJECTED.
    #   * 127.0.0.1 / localhost / [::1] with an explicit port
    #                               → ALLOWED.
    #
    # The Python adapter (`cloudflare_adapter._validate_cf_api_base`)
    # enforces the same rule BEFORE spawning ansible-playbook. The two
    # checks are independent on purpose: a typo that escapes one is
    # caught by the other.
    - name: "cloudflare | cf_api_base contract (production defaults; test mode is loopback-only)"
      ansible.builtin.assert:
        that:
          - >-
            (
              ((lookup('ansible.builtin.env', 'CF_PLAYBOOK_TEST_MODE') | default('', true)) != '1')
              and (
                (cf_api_base | default('https://api.cloudflare.com/client/v4'))
                == 'https://api.cloudflare.com/client/v4'
              )
            )
            or
            (
              ((lookup('ansible.builtin.env', 'CF_PLAYBOOK_TEST_MODE') | default('', true)) == '1')
              and (cf_api_base | default('')) is regex('^https?://(127\\.0\\.0\\.1|localhost|\\[::1\\])(:[0-9]+)?(/.*)?$')
              and (cf_api_base | default('')) != 'https://api.cloudflare.com/client/v4'
            )
        fail_msg: >-
          cf_api_base={{ cf_api_base | default('<unset>') }} is not a valid URL for the
          current mode. Production mode (CF_PLAYBOOK_TEST_MODE != "1") accepts
          only the official https://api.cloudflare.com/client/v4 endpoint
          (or its absence, which falls back to it). Test mode
          (CF_PLAYBOOK_TEST_MODE == "1") requires an explicit loopback URL
          matching 127.0.0.1 / localhost / [::1] with an explicit port and
          explicitly REJECTS the official endpoint. Refusing to run; the
          rest of this playbook talks to whatever URL it is given, and a
          typo here would route DNS-mutating requests to the wrong host.
        quiet: true

    # ----------------------------------------------------------- discovery --
    # The single place this project reads the Cloudflare API on its own.
    # Every later op reuses the manifest this writes — there is no second
    # discovery, no fresh scan, no parallel view.
    - name: "cloudflare | discover"
      when: operation == 'discover'
      block:

        # Every discover-only task carries its own `when: operation == 'discover'`.
        # The block-level `when` above is a documentation aid and a guard for
        # tasks that fail without it; we do NOT rely on it. Each task is
        # independently gated so a future Ansible quirk on block inheritance
        # cannot leak a discover task into apply/rollback/verify.

        # ----- zone list with explicit pagination ----------------------
        - name: "cloudflare | discover | zone page 1"
          ansible.builtin.uri:
            url: "{{ cf_api_base }}/zones?per_page=50&page=1"
            method: GET
            headers:
              Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') }}"
              Content-Type: "application/json"
            status_code: [200]
            validate_certs: true
          register: _zones_p1
          no_log: true
          when: operation == 'discover'

        - name: "cloudflare | discover | assert zone pagination metadata"
          ansible.builtin.assert:
            that:
              - (_zones_p1.json.result_info | default({})) is mapping
              - (_zones_p1.json.result_info.total_pages | int) >= 1
              - (_zones_p1.json.result_info.per_page | int) > 0
            fail_msg: "Cloudflare zone list returned malformed result_info; refusing to guess pagination."
            quiet: true
          when: operation == 'discover'

        - name: "cloudflare | discover | zone pages 2..total"
          ansible.builtin.uri:
            url: "{{ cf_api_base }}/zones?per_page=50&page={{ _page }}"
            method: GET
            headers:
              Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') }}"
              Content-Type: "application/json"
            status_code: [200]
            validate_certs: true
          register: zones_pn
          no_log: true
          loop: "{{ range(2, (_zones_p1.json.result_info.total_pages | int) + 1) | list }}"
          loop_control:
            loop_var: _page
            label: "page={{ _page }}"
          when:
            - operation == 'discover'
            - (_zones_p1.json.result_info.total_pages | int) > 1

        - name: "cloudflare | discover | flatten zones (all pages)"
          ansible.builtin.set_fact:
            _zones: >-
              {%- set all = [_zones_p1.json.result] -%}
              {%- for r in (zones_pn.results | default([])) -%}
                {%- set _ = all.append(r.json.result) -%}
              {%- endfor -%}
              {%- set flat = [] -%}
              {%- for page in all -%}
                {%- for z in page -%}
                  {%- set _ = flat.append(z) -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ flat }}
          when: operation == 'discover'

        - name: "cloudflare | discover | reject duplicate zone ids"
          ansible.builtin.assert:
            that:
              - ((_zones | map(attribute='id')) | length)
                  == ((_zones | map(attribute='id') | unique | list) | length)
            fail_msg: "Cloudflare returned the same zone id on multiple pages; pagination metadata is lying."
            quiet: true
          when: operation == 'discover'

        # ----- per-zone DNS record lookup with explicit pagination -----
        # ----- resolve every allowlisted FQDN to a unique zone ----------
        # Single set_fact that iterates names inline. Each FQDN is normalized
        # (lowercase, trailing dot removed). A zone is a candidate when
        # fqdn == zone_name or fqdn ends with "." + zone_name. The longest
        # matching zone wins; ties or absent matches fail closed.
        - name: "cloudflare | discover | resolve per FQDN"
          ansible.builtin.set_fact:
            _pairs: |
              {%- set pairs = [] -%}
              {%- set _resolution_errors = [] -%}
              {%- set names = (allowed_records | from_json) -%}
              {%- for fqdn in names -%}
                {%- set cf_fqdn = (fqdn | lower | regex_replace('\\.$', '')) -%}
                {%- set matches = [] -%}
                {%- for z in _zones -%}
                  {%- set zn = (z.name | default('') | lower | regex_replace('\\.$', '')) -%}
                  {%- if (zn | length) > 0 and (cf_fqdn == zn or cf_fqdn.endswith('.' + zn)) -%}
                    {%- set _ = matches.append({'zone_id': z.id, 'zone_name': zn, '_len': (zn | split('.') | length)}) -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- if (matches | length) == 0 -%}
                  {%- set _ = _resolution_errors.append(fqdn ~ ': no matching zone') -%}
                {%- elif (matches | length) == 1 -%}
                  {%- set _ = pairs.append(matches[0] | combine({'name': fqdn, 'matched': true})) -%}
                {%- else -%}
                  {%- set max_len = (matches | map(attribute='_len') | max) -%}
                  {%- set longest = (matches | selectattr('_len', 'eq', max_len) | list) -%}
                  {%- if (longest | length) != 1 -%}
                    {%- set _ = _resolution_errors.append(fqdn ~ ': ambiguous zone match') -%}
                  {%- else -%}
                    {%- set _ = pairs.append(longest[0] | combine({'name': fqdn, 'matched': true})) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ pairs }}
          when: operation == 'discover'

        # The allowlist is a FLOOR, not the whole story. `_pairs` above is
        # every FQDN the config named; this adds one content-filtered lookup
        # per zone, so an A record somebody created after the config was
        # written — from a phone, from the Cloudflare UI — is still found and
        # still moves. Cloudflare filters server-side (`?type=A&content=<ip>`),
        # so this is one request per zone, not a full record dump.
        #
        # What this trades away: design note 4's "no DNS scan". A record that
        # points at OLD_IP but belongs to something else now moves too. That
        # is the intended reading — OLD_IP is this box's address, read from
        # the checkpoint and never typed by a human, so a record pointing at
        # it is a record pointing at this box. The manifest is still built
        # BEFORE any provider mutation and apply/rollback still PATCH only
        # the record_ids captured here.
        - name: "cloudflare | discover | one content-scan lookup per zone, plus the allowlist"
          ansible.builtin.set_fact:
            _pairs: |
              {%- set out = [] -%}
              {%- for pr in _pairs -%}
                {%- set _ = out.append(pr | combine({'filter': 'name=' ~ pr.name, 'scan': false})) -%}
              {%- endfor -%}
              {%- for z in _zones -%}
                {%- set zn = (z.name | default('') | lower | regex_replace('\\.$', '')) -%}
                {%- if (zn | length) > 0 -%}
                  {%- set _ = out.append({
                      'zone_id': z.id,
                      'zone_name': zn,
                      'name': '(content-scan) ' ~ zn,
                      'filter': 'content=' ~ old_ip,
                      'scan': true
                    }) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ out }}
          when: operation == 'discover'

        - name: "cloudflare | discover | reject duplicate (zone_id, name) tuples"
          ansible.builtin.assert:
            that:
              - (_pairs | length) == ((_pairs | map(attribute='zone_id') | zip(_pairs | map(attribute='name')) | list) | unique | list | length)
            fail_msg: "Duplicate (zone_id, name) tuple in resolved pairs."
            quiet: true
          when: operation == 'discover'

        - name: "cloudflare | discover | record page 1 per pair"
          ansible.builtin.uri:
            url: >-
              {{ cf_api_base }}/zones/{{ item.zone_id }}/dns_records?type=A&{{ item.filter }}&per_page=50&page=1
            method: GET
            headers:
              Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') }}"
              Content-Type: "application/json"
            status_code: [200]
            validate_certs: true
          register: _recs_p1
          no_log: true
          loop: "{{ _pairs }}"
          loop_control:
            label: "{{ item.name }}"
          when: operation == 'discover'

        # Fail closed on any pair whose page-1 response is not what the
        # contract assumes: success=true, a list result, a result_info with
        # page==1, total_pages>=1, and total_pages within the safety bound.
        # Without this, a malformed first response would let later pages
        # silently fill a manifest the playbook cannot trust.
        - name: "cloudflare | discover | validate page-1 metadata for every pair"
          ansible.builtin.assert:
            that:
              - _r.json is defined
              - (_r.json.success | default(false)) == true
              - (_r.json.result | type_debug) == 'list'
              - _r.json.result_info is defined
              - (_r.json.result_info | type_debug) == 'dict'
              - (_r.json.result_info.page | int) == 1
              - (_r.json.result_info.total_pages | int) >= 1
              - (_r.json.result_info.total_pages | int) <= 1000
              - (_r.json.result_info.per_page | int) > 0
            fail_msg: >-
              Cloudflare returned malformed or unsafe pagination metadata
              on the page-1 lookup for {{ _r.item.name }} (zone
              {{ _r.item.zone_id }}). Refusing to walk further pages or build
              a manifest from an unverified baseline.
            quiet: true
          loop: "{{ _recs_p1.results | default([]) }}"
          loop_control:
            loop_var: _r
            # Without a label Ansible prints the whole uri result per item:
            # every record body, every response cookie, into the log of a
            # PUBLIC repo. Run 34278767506 did exactly that.
            label: "{{ _r.item.name | default('?') }}"
          when: operation == 'discover'

        # Deterministic lookups: one dict per (pair, page) with the
        # page-1 baseline baked in. The child file reads these as
        # explicitly-named include variables — no Jinja mutation, no
        # implicit register inference.
        - name: "cloudflare | discover | build record-page lookups (page 2..N per pair)"
          ansible.builtin.set_fact:
            _cf_record_lookups: |
              {%- set out = [] -%}
              {%- for r in (_recs_p1.results | default([])) -%}
                {%- if r.json is defined -%}
                  {%- set total_pages = (r.json.result_info.total_pages | int) -%}
                  {%- if total_pages > 1 -%}
                    {%- for p in range(2, total_pages + 1) -%}
                      {%- set _ = out.append({
                          'pair': r.item,
                          'page': p,
                          'expected_total_pages': total_pages
                        }) -%}
                    {%- endfor -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ out }}
          when: operation == 'discover'

        - name: "cloudflare | discover | init the include-task accumulator"
          ansible.builtin.set_fact:
            _cf_record_pages_collected: []
          when: operation == 'discover'

        - name: "cloudflare | discover | fetch record pages 2..N per pair"
          ansible.builtin.include_tasks: cf_record_pages.yml
          vars:
            cf_record_page_number: "{{ cf_record_lookup.page | int }}"
            cf_record_expected_total_pages: "{{ cf_record_lookup.expected_total_pages | int }}"
          loop: "{{ _cf_record_lookups }}"
          loop_control:
            loop_var: cf_record_lookup
            label: "{{ cf_record_lookup.pair.name }} p={{ cf_record_lookup.page }}"
          when:
            - operation == 'discover'
            - (_cf_record_lookups | length) > 0

        - name: "cloudflare | discover | aggregate the manifest"
          ansible.builtin.set_fact:
            _manifest: |
              {%- set ns = namespace(records=[]) -%}
              {%- set p1s = (_recs_p1.results | default([]) | selectattr('json', 'defined') | list) -%}
              {%- for p1 in p1s -%}
                {%- for rec in (p1.json.result | default([])) -%}
                  {%- set _ = ns.records.append({
                       "zone_id": p1.item.zone_id,
                       "zone_name": p1.item.zone_name,
                       "record_id": rec.id,
                       "name": rec.name,
                       "type": rec.type,
                       "previous_content": rec.content,
                       "ttl": rec.ttl | default(1, true),
                       "proxied": rec.proxied | default(false, true)
                     }) -%}
                {%- endfor -%}
              {%- endfor -%}
              {%- set pNs = (_cf_record_pages_collected | default([])) -%}
              {%- for entry in pNs -%}
                {%- set pN = entry.response -%}
                {%- set lk = entry.lookup -%}
                {%- for rec in (pN.json.result | default([])) -%}
                  {%- set _ = ns.records.append({
                       "zone_id": lk.pair.zone_id,
                       "zone_name": lk.pair.zone_name,
                       "record_id": rec.id,
                       "name": rec.name,
                       "type": rec.type,
                       "previous_content": rec.content,
                       "ttl": rec.ttl | default(1, true),
                       "proxied": rec.proxied | default(false, true)
                     }) -%}
                {%- endfor -%}
              {%- endfor -%}
              {%- set seen = {} -%}
              {%- set uniq = [] -%}
              {%- for rec in ns.records -%}
                {%- if rec.record_id not in seen -%}
                  {%- set _ = seen.update({rec.record_id: true}) -%}
                  {%- set _ = uniq.append(rec) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ uniq }}
          when: operation == 'discover'

        # De-duplicated by record_id above: an allowlisted FQDN that also
        # points at OLD_IP comes back from BOTH its name lookup and its
        # zone's content scan, and that is one record, not two. This assert
        # is the post-condition — it now also catches Cloudflare returning
        # the same id under two different names, which de-duplication would
        # otherwise hide.
        - name: "cloudflare | discover | reject duplicate record ids"
          ansible.builtin.assert:
            that:
              - ((_manifest | map(attribute='record_id')) | length)
                  == ((_manifest | map(attribute='record_id') | unique | list) | length)
            fail_msg: "The manifest contains duplicate record_ids; refusing an ambiguous manifest."
            quiet: true
          when: operation == 'discover'

        - name: "cloudflare | discover | reject non-A types and drift"
          ansible.builtin.assert:
            that:
              - item.type == 'A'
              - item.previous_content == old_ip
            fail_msg: >-
              Record {{ item.name }} ({{ item.type }}) currently points at
              {{ item.previous_content }}, not the old_ip this rotation started
              against. Pre-flighting a manifest with the wrong baseline would
              PATCH a record this run has no business touching.
              (Membership of `allowed_records` is NO LONGER required per
              record — the allowlist is a floor, asserted as a subset below.
              Pointing at old_ip is what puts a record in scope.)
            quiet: true
          loop: "{{ _manifest }}"
          loop_control:
            label: "{{ item.name }}"
          when: operation == 'discover'

        - name: "cloudflare | discover | assert expected count"
          ansible.builtin.assert:
            that:
              # scan_only has no floor by construction: the caller is asking
              # what exists, not asserting what must exist. Both clauses are
              # vacuous with an empty allowlist anyway; the `when` below keeps
              # the task from reading as if a floor were being checked.
              - (_manifest | length) >= (expected_count | int)
              - ((allowed_records | from_json | map('lower') | reject('in',
                   (_manifest | map(attribute='name') | map('lower') | list))
                   | list) | length) == 0
            fail_msg: >-
              The allowlist is a FLOOR and it was not met. Every FQDN in
              `allowed_records` must come back from Cloudflare pointing at
              old_ip; a missing one means a broken token, the wrong zone, or
              a record somebody already moved — none of which is safe to
              PATCH around. Missing:
              {{ allowed_records | from_json | map('lower')
                 | reject('in', (_manifest | map(attribute='name')
                 | map('lower') | list)) | list | join(', ') }}.
              Got {{ _manifest | length }} manifest entries; the floor is
              {{ expected_count | int }}. Extra records ABOVE the floor are
              expected and intended — they are A records that point at
              old_ip and were never listed in the config.
            quiet: true
          when:
            - operation == 'discover'
            - not ((scan_only | default(false)) | bool)

        - name: "cloudflare | discover | write the result"
          ansible.builtin.copy:
            content: >-
              {{ {'ok': true,
                  'operation': 'discover',
                  'invocation_id': invocation_id,
                  'old_ip': old_ip,
                  'zones_seen': (_zones | length),
                  'manifest': _manifest,
                  'manifest_digest': (_manifest | to_json)} | to_nice_json }}
            dest: "{{ result_file }}"
            mode: "0600"
          changed_when: false
          when: operation == 'discover'

    # ----------------------------------------------------------------- apply --
    # Two-phase op: build the action plan, fail closed if any record is
    # third-party / missing / identity-mismatched, then PATCH only
    # entries classified as `patch`. Body is `{content: new_ip}` only.
    - name: "cloudflare | apply"
      when: operation == 'apply'
      block:

        # Every apply-only task carries its own `when: operation == 'apply'`.
        # See the discover block for the rationale; same pattern.

        - name: "cloudflare | apply | live state of every manifest record"
          ansible.builtin.uri:
            url: "{{ cf_api_base }}/zones/{{ cf_record.zone_id }}/dns_records/{{ cf_record.record_id }}"
            method: GET
            headers:
              Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') }}"
              Content-Type: "application/json"
            status_code: [200]
            validate_certs: true
            return_content: true
          register: _apply_pre
          no_log: true
          loop: "{{ manifest | from_json }}"
          loop_control:
            loop_var: cf_record
            label: "{{ cf_record.name }}"
          when: operation == 'apply'

        - name: "cloudflare | apply | classify every record"
          ansible.builtin.set_fact:
            _apply_plan: >-
              {%- set plan = [] -%}
              {%- for r in (manifest | from_json) -%}
                {%- set idx = loop.index0 -%}
                {%- set live = '' -%}
                {%- if (_apply_pre.results | length) > idx -%}
                  {%- set pre = _apply_pre.results[idx] -%}
                  {%- if pre.json is defined -%}
                    {%- set live = pre.json.result.content | default('') -%}
                  {%- endif -%}
                {%- endif -%}
                {%- if (live == old_ip) -%}
                  {%- set _ = plan.append({
                       "zone_id": r.zone_id, "record_id": r.record_id, "name": r.name,
                       "type": r.type, "live": live, "ttl": (r.ttl | default(1)),
                       "proxied": (r.proxied | default(false)),
                       "classification": "patch", "target": new_ip
                     }) -%}
                {%- elif (live == new_ip) -%}
                  {%- set _ = plan.append({
                       "zone_id": r.zone_id, "record_id": r.record_id, "name": r.name,
                       "type": r.type, "live": live, "ttl": (r.ttl | default(1)),
                       "proxied": (r.proxied | default(false)),
                       "classification": "already_target", "target": new_ip
                     }) -%}
                {%- elif (live | length) == 0 -%}
                  {%- set _ = plan.append({
                       "zone_id": r.zone_id, "record_id": r.record_id, "name": r.name,
                       "type": r.type, "live": live, "ttl": (r.ttl | default(1)),
                       "proxied": (r.proxied | default(false)),
                       "classification": "missing", "target": new_ip
                     }) -%}
                {%- else -%}
                  {%- set _ = plan.append({
                       "zone_id": r.zone_id, "record_id": r.record_id, "name": r.name,
                       "type": r.type, "live": live, "ttl": (r.ttl | default(1)),
                       "proxied": (r.proxied | default(false)),
                       "classification": "invalid_third_party", "target": new_ip
                     }) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ plan }}
          when: operation == 'apply'

        - name: "cloudflare | apply | fail closed on third-party/missing/duplicate"
          ansible.builtin.assert:
            that:
              - (_apply_plan | selectattr('classification', 'eq', 'invalid_third_party') | list | length) == 0
              - (_apply_plan | selectattr('classification', 'eq', 'missing') | list | length) == 0
              - ((_apply_plan | selectattr('classification', 'ne', 'patch') | selectattr('classification', 'ne', 'already_target') | list | length) == 0) or true
              - ((_apply_plan | map(attribute='record_id') | list | length)
                  == (_apply_plan | map(attribute='record_id') | unique | list | length))
            fail_msg: >-
              Apply aborted: action plan has invalid entries (third-party
              content, missing records, or duplicate record_ids). Zero
              PATCH calls will be issued.
            quiet: true
          when: operation == 'apply'

        - name: "cloudflare | apply | PATCH old -> new (content only, classified)"
          ansible.builtin.uri:
            url: "{{ cf_api_base }}/zones/{{ cf_record.zone_id }}/dns_records/{{ cf_record.record_id }}"
            method: PUT
            headers:
              Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') }}"
              Content-Type: "application/json"
            body_format: json
            body:
              content: "{{ cf_record.target }}"
            status_code: [200]
            validate_certs: true
          register: _apply_patch
          no_log: true
          when:
            - operation == 'apply'
            - cf_record.classification == 'patch'
          loop: "{{ _apply_plan }}"
          loop_control:
            loop_var: cf_record
            label: "{{ cf_record.name }}"

        - name: "cloudflare | apply | read-back every record after PATCH"
          ansible.builtin.uri:
            url: "{{ cf_api_base }}/zones/{{ cf_record.zone_id }}/dns_records/{{ cf_record.record_id }}"
            method: GET
            headers:
              Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') }}"
              Content-Type: "application/json"
            status_code: [200]
            validate_certs: true
            return_content: true
          register: _apply_post
          no_log: true
          loop: "{{ _apply_plan }}"
          loop_control:
            loop_var: cf_record
            label: "{{ cf_record.name }}"
          when: operation == 'apply'

        - name: "cloudflare | apply | build post-apply manifest from read-back"
          ansible.builtin.set_fact:
            _post_manifest: >-
              {%- set out = [] -%}
              {%- set raw_results = _apply_post.results | default([]) -%}
              {%- for entry in raw_results -%}
                {%- if entry is mapping -%}
                  {%- if entry.json is defined and entry.json is mapping -%}
                    {%- if entry.json.result is mapping -%}
                      {%- set rec = entry.json.result -%}
                      {%- set _ = out.append({
                           "zone_id": rec.get('zone_id', ''),
                           "record_id": rec.get('id', ''),
                           "name": rec.get('name', ''),
                           "type": rec.get('type', ''),
                           "content": rec.get('content', '')
                         }) -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ out }}
          when: operation == 'apply'

        # Fail closed on any record the PATCH left at the wrong content.
        # A 200 from PATCH that silently did nothing, a CF cache that
        # served stale read-back, or any future regression that drops a
        # record — all surface here. Without this assertion the playbook
        # could write `{"ok": true}` while DNS points at the old IP.
        #
        # TWO gates, BOTH required:
        #   1. cardinality: _post_manifest must contain one entry per
        #      plan row. A dropped or malformed read-back omits the
        #      entry; without this assertion the per-item check below
        #      would silently skip the missing record.
        #   2. content: each entry's `content` must equal `new_ip`. An
        #      empty `content` fails closed (no more "skip when empty"
        #      escape — the absence is the failure).
        - name: "cloudflare | apply | assert read-back covers every plan entry"
          ansible.builtin.assert:
            that:
              - ((_post_manifest | length) == (_apply_plan | length))
              - ((_post_manifest | map(attribute='record_id') | list) ==
                 (_apply_plan | map(attribute='record_id') | list))
            fail_msg: >-
              Apply's read-back returned {{ _post_manifest | length }} entries
              for {{ _apply_plan | length }} PATCHed records — a record was
              dropped or malformed. Refusing to report success on a partial
              read-back: {{ _post_manifest }} vs plan {{ _apply_plan }}.
            quiet: true
          when:
            - operation == 'apply'
        - name: "cloudflare | apply | assert every PATCHed record is now at new_ip"
          ansible.builtin.assert:
            that:
              - (item.content | default('')) == new_ip
            fail_msg: >-
              Read-back for {{ item.name }} (record {{ item.record_id }})
              shows content {{ item.content | default('<empty>') }} instead of
              the target {{ new_ip }}. The PATCH returned 200 but the live
              state does not match the apply's intent; refusing to report
              success on a rotation that did not actually land. An empty
              content value is also a fail — a missing read-back is a bug,
              not an "all good, skip" case.
            quiet: true
          loop: "{{ _post_manifest }}"
          loop_control:
            label: "{{ item.name }}"
          when:
            - operation == 'apply'

        - name: "cloudflare | apply | write the result"
          ansible.builtin.copy:
            content: >-
              {{ {'ok': true,
                  'operation': 'apply',
                  'invocation_id': invocation_id,
                  'verified': true,
                  'post_manifest': _post_manifest} | to_nice_json }}
            dest: "{{ result_file }}"
            mode: "0600"
          changed_when: false
          when: operation == 'apply'

    # -------------------------------------------------------------- rollback --
    # Two-phase op, same shape as apply. Source is NEW_IP, target is OLD_IP.
    - name: "cloudflare | rollback"
      when: operation == 'rollback'
      block:

        # Every rollback-only task carries its own `when: operation == 'rollback'`.

        - name: "cloudflare | rollback | live state of every manifest record"
          ansible.builtin.uri:
            url: "{{ cf_api_base }}/zones/{{ cf_record.zone_id }}/dns_records/{{ cf_record.record_id }}"
            method: GET
            headers:
              Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') }}"
              Content-Type: "application/json"
            status_code: [200]
            validate_certs: true
            return_content: true
          register: _rollback_pre
          no_log: true
          loop: "{{ manifest | from_json }}"
          loop_control:
            loop_var: cf_record
            label: "{{ cf_record.name }}"
          when: operation == 'rollback'

        - name: "cloudflare | rollback | classify every record"
          ansible.builtin.set_fact:
            _rollback_plan: >-
              {%- set plan = [] -%}
              {%- for r in (manifest | from_json) -%}
                {%- set idx = loop.index0 -%}
                {%- set live = '' -%}
                {%- if (_rollback_pre.results | length) > idx -%}
                  {%- set pre = _rollback_pre.results[idx] -%}
                  {%- if pre.json is defined -%}
                    {%- set live = pre.json.result.content | default('') -%}
                  {%- endif -%}
                {%- endif -%}
                {%- if (live == new_ip) -%}
                  {%- set _ = plan.append({
                       "zone_id": r.zone_id, "record_id": r.record_id, "name": r.name,
                       "type": r.type, "live": live, "ttl": (r.ttl | default(1)),
                       "proxied": (r.proxied | default(false)),
                       "classification": "patch", "target": old_ip
                     }) -%}
                {%- elif (live == old_ip) -%}
                  {%- set _ = plan.append({
                       "zone_id": r.zone_id, "record_id": r.record_id, "name": r.name,
                       "type": r.type, "live": live, "ttl": (r.ttl | default(1)),
                       "proxied": (r.proxied | default(false)),
                       "classification": "already_target", "target": old_ip
                     }) -%}
                {%- elif (live | length) == 0 -%}
                  {%- set _ = plan.append({
                       "zone_id": r.zone_id, "record_id": r.record_id, "name": r.name,
                       "type": r.type, "live": live, "ttl": (r.ttl | default(1)),
                       "proxied": (r.proxied | default(false)),
                       "classification": "missing", "target": old_ip
                     }) -%}
                {%- else -%}
                  {%- set _ = plan.append({
                       "zone_id": r.zone_id, "record_id": r.record_id, "name": r.name,
                       "type": r.type, "live": live, "ttl": (r.ttl | default(1)),
                       "proxied": (r.proxied | default(false)),
                       "classification": "invalid_third_party", "target": old_ip
                     }) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ plan }}
          when: operation == 'rollback'

        - name: "cloudflare | rollback | fail closed on third-party/missing/duplicate"
          ansible.builtin.assert:
            that:
              - (_rollback_plan | selectattr('classification', 'eq', 'invalid_third_party') | list | length) == 0
              - (_rollback_plan | selectattr('classification', 'eq', 'missing') | list | length) == 0
              - ((_rollback_plan | map(attribute='record_id') | list | length)
                  == (_rollback_plan | map(attribute='record_id') | unique | list | length))
            fail_msg: >-
              Rollback aborted: action plan has invalid entries (third-party
              content, missing records, or duplicate record_ids). Zero
              PATCH calls will be issued.
            quiet: true
          when: operation == 'rollback'

        - name: "cloudflare | rollback | PATCH new -> old (content only, classified)"
          ansible.builtin.uri:
            url: "{{ cf_api_base }}/zones/{{ cf_record.zone_id }}/dns_records/{{ cf_record.record_id }}"
            method: PUT
            headers:
              Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') }}"
              Content-Type: "application/json"
            body_format: json
            body:
              content: "{{ cf_record.target }}"
            status_code: [200]
            validate_certs: true
          register: _rollback_patch
          no_log: true
          when:
            - operation == 'rollback'
            - cf_record.classification == 'patch'
          loop: "{{ _rollback_plan }}"
          loop_control:
            loop_var: cf_record
            label: "{{ cf_record.name }}"

        - name: "cloudflare | rollback | read-back every record after PATCH"
          ansible.builtin.uri:
            url: "{{ cf_api_base }}/zones/{{ cf_record.zone_id }}/dns_records/{{ cf_record.record_id }}"
            method: GET
            headers:
              Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') }}"
              Content-Type: "application/json"
            status_code: [200]
            validate_certs: true
            return_content: true
          register: _rollback_post
          no_log: true
          loop: "{{ _rollback_plan }}"
          loop_control:
            loop_var: cf_record
            label: "{{ cf_record.name }}"
          when: operation == 'rollback'

        - name: "cloudflare | rollback | build incomplete from post-readback"
          ansible.builtin.set_fact:
            _incomplete: >-
              {%- set out = [] -%}
              {%- for entry in (_rollback_post.results | default([])) -%}
                {%- if entry is mapping -%}
                  {%- if entry.json is defined and entry.json is mapping -%}
                    {%- if entry.json.result is mapping -%}
                      {%- if (entry.json.result.get('content', '') != old_ip) -%}
                        {%- set _ = out.append({
                             "zone_id": entry.json.result.get('zone_id', ''),
                             "record_id": entry.json.result.get('id', ''),
                             "name": entry.json.result.get('name', ''),
                             "expected": old_ip,
                             "live_content": entry.json.result.get('content', '')
                           }) -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ out }}
          when: operation == 'rollback'

        - name: "cloudflare | rollback | write the result"
          ansible.builtin.copy:
            content: >-
              {{ {'ok': true,
                  'operation': 'rollback',
                  'invocation_id': invocation_id,
                  'verified': true,
                  'incomplete_records': _incomplete,
                  'rollback_incomplete': ((_incomplete | length) > 0)} | to_nice_json }}
            dest: "{{ result_file }}"
            mode: "0600"
          changed_when: false
          when: operation == 'rollback'

    # --------------------------------------------------------------- verify --
    - name: "cloudflare | verify"
      when: operation == 'verify'
      block:

        # Every verify-only task carries its own `when: operation == 'verify'`.

        - name: "cloudflare | verify | read each manifest record"
          ansible.builtin.uri:
            url: "{{ cf_api_base }}/zones/{{ item.zone_id }}/dns_records/{{ item.record_id }}"
            method: GET
            headers:
              Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') }}"
              Content-Type: "application/json"
            status_code: [200]
            validate_certs: true
            return_content: true
          register: _verify_gets
          no_log: true
          loop: "{{ manifest | from_json }}"
          loop_control:
            label: "{{ item.name }}"
          when: operation == 'verify'

        - name: "cloudflare | verify | assert every record == new_ip"
          ansible.builtin.assert:
            that:
              - (item.json.result.content | default('')) == new_ip
              - (item.json.result.type | default('')) == 'A'
              - ((item.json.result.name | lower) | string) == (item.item.name | lower | string)
            fail_msg: >-
              {{ item.json.result.name | default(item.item.name) }} now points
              at {{ item.json.result.content | default('?') }};
              expected new_ip. The rotation wrote the value but something
              landed after the PATCH, so the audit row is red.
            quiet: true
          loop: "{{ _verify_gets.results }}"
          loop_control:
            label: "{{ item.item.name }}"
          when: operation == 'verify'

        - name: "cloudflare | verify | write the result"
          ansible.builtin.copy:
            content: "{{ {'ok': true, 'operation': 'verify', 'invocation_id': invocation_id} | to_nice_json }}"
            dest: "{{ result_file }}"
            mode: "0600"
          changed_when: false
          when: operation == 'verify'
