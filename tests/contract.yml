---
# =============================================================================
# server-ip-rotation — offline contract + the Python suite, in one target.
#
#   ansible-playbook tests/contract.yml            (or: make test)
#
# Fully offline: no inventory, no host, no network, no Hetzner. The Python
# tests fake the runner seam, so `ansible-playbook hcloud_step.yml` is never
# invoked either.
#
# Two jobs, and they are different jobs:
#
#   1. RUN the unittest suite and the self-test. Those cover behaviour — the
#      state machine, the rollback table, resume-from-every-checkpoint.
#
#   2. READ hcloud_step.yml as text and as YAML, and assert the never-delete
#      contract on it, the same way tests/no_delete_contract_offline_test.yml
#      does for roles/. Behaviour tests cannot catch a `state: absent` added to
#      a branch no test exercises; this can.
#
# This file deliberately does NOT scan the Python sources for the forbidden
# strings: they legitimately appear there in error messages and in comments
# explaining the ban. hcloud_step.yml is the only file that can actually issue
# a delete, so it is the only file that matters here.
# =============================================================================
- name: "server-ip-rotation contract"
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  any_errors_fatal: true

  vars:
    ansible_managed: "Managed by Ansible (server-ip-rotation) - do not edit by hand"
    _repo: "{{ playbook_dir | dirname }}"
    _proj: "{{ playbook_dir | dirname }}"
    _step_file: "{{ playbook_dir | dirname }}/hcloud_step.yml"
    _cf_step_file: "{{ playbook_dir | dirname }}/cloudflare_replace_ip_step.yml"

    # Patterns that must appear NOWHERE in hcloud_step.yml. Comments are
    # stripped before the scan, because that file EXPLAINS several of these in
    # a comment right above the safe version.
    forbidden:
      - pattern: 'state:\s*absent'
        why: >-
          Nothing this tool runs may delete a server or a Primary IP. The
          rollback path RETAINS the new address and the old one is never
          removed — deleting either is a separate operator decision.

      - pattern: 'auto_delete:\s*true'
        why: >-
          auto_delete lets Hetzner reclaim a Primary IP when the resource it is
          attached to goes away. On the OLD address that destroys the only way
          back mid-rotation; on the new one it makes the result unstable.

      - pattern: 'server_type:'
        why: >-
          `force: true` next to `server_type:` authorises an irreversible disk
          resize. This file uses force to power a box down for an IP move and
          must never carry a server type at all.

      - pattern: 'ignore_errors:'
        why: >-
          A green-but-failed step here means a powered-off box with an address
          nobody knows. A module failure must abort the play, write no JSON,
          and let rotate.py see the non-zero rc.

      - pattern: 'failed_when:\s*false'
        why: >-
          Same as ignore_errors. This repo already paid for this once: an AIDE
          task with failed_when:false silently checked nothing for months.

      - pattern: 'no_log:\s*true'
        why: >-
          no_log on an hcloud task hides WHICH action failed while hiding
          nothing that matters — the modules' own argspec already marks
          api_token as no_log. Losing the result turns a debuggable failure
          into a powered-off box and a shrug.

      - pattern: 'api_token:'
        why: >-
          The token is read from HCLOUD_TOKEN by the modules themselves. Passing
          it as a parameter puts it in a var file or in argv.

    # Values that must be PRESENT. Each one removes a failure class.
    required:
      - file: "hcloud_step.yml"
        pattern: 'connection:\s*local'
        why: "the node is powered off for half a rotation"
      - file: "hcloud_step.yml"
        pattern: 'gather_facts:\s*false'
        why: "a stray fact gather would hang on the box that has no address"
      # Trap #2: `enable_ipv4: false` on its own is a silent no-op — the
      # collection only calls _update_server_ip() when `ipv4:` is not None.
      - file: "hcloud_step.yml"
        pattern: 'enable_ipv4:\s*false'
        why: "the unassign op needs it alongside an explicit ipv4:"
      # The confirmation is the target's own numeric id, never `true`.
      - file: "rotate.py"
        pattern: 'confirm-server-id'
        why: "the destructive-confirmation pattern this repo uses everywhere"
      - file: "rotate.py"
        pattern: "retention.*must be 'keep'"
        why: "deleting the previous address is not implemented on purpose"
      - file: "ansible_adapter.py"
        pattern: 'IP_CHANGE_ARGV_TEMPLATE'
        why: >-
          the DNS move goes through the existing `make ip-change HOST=<alias>`
          target, not a hand-rolled -l invocation that would strip the doctor
      - file: ".gitignore"
        pattern: 'state/'
        why: "checkpoints are runtime state, not source"
      # The CD split. PAUSABLE lists only the states where the box is up,
      # reachable, AND the DNS picture is settled (or about to be — the
      # ci pipeline only pauses at the post-DNS state). Widening this list
      # lets a CI job stop between detach and attach.
      - file: "rotate.py"
        pattern: 'PAUSABLE = \('
        why: >-
          --until only names PAUSABLE states; the assertion above lists
          exactly which string entries belong there. Widening this list lets
          a CI job stop between detach and attach.
      # The human gate the interactive prompt used to be, on GitHub Actions.
      # Three independent halves, because any one of them alone still lets a
      # real rotation happen off a git push:
      - file: ".github/workflows/run.yml"
        pattern: 'workflow_dispatch:\n    inputs:'
        why: >-
          the rotation is dispatched by a person filling a form, never bare
      - file: ".github/workflows/run.yml"
        pattern: "if: inputs.operation == 'change-ip'"
        why: >-
          push and pull_request share this file with the operations, and this
          gate is what keeps them apart: a push has no inputs, so the mutating
          chain starts from a job a push can never satisfy
      - file: ".github/workflows/run.yml"
        pattern: 'environment: hetzner-production'
        why: >-
          the mutating jobs read HCLOUD_TOKEN from an environment secret, not a
          repo secret: a repo secret is readable by any workflow on any branch.
          Required reviewers on this environment would be the pause too, but
          that is PAID for a private repo. Without reviewers the pause is two
          dispatches — `operation: plan` then `operation: change-ip` — and it
          is a habit, not a check.
      - file: ".github/workflows/run.yml"
        pattern: 'grep -q -- "\$NEW_IP" /tmp/shikoonet/inventory/hosts.yml'
        why: >-
          `yes` is only ever answered to the inventory prompt after the new
          address has been re-derived from the shikoonet checkout. Delete this
          and the pipeline is piping yes at a question it did not verify

  tasks:

    # ---- 1. behaviour -------------------------------------------------------
    - name: "ip-rotation | the offline python suite"
      ansible.builtin.command:
        cmd: "python3 -m unittest discover -s tests -t ."
        chdir: "{{ _proj }}"
      register: _unittest
      changed_when: false

    - name: "ip-rotation | unittest summary"
      ansible.builtin.debug:
        msg: "{{ _unittest.stderr_lines[-3:] }}"

    - name: "ip-rotation | rotate.py --self-test"
      ansible.builtin.command:
        cmd: "python3 rotate.py --self-test"
        chdir: "{{ _proj }}"
      register: _selftest
      changed_when: false

    # A plan with no credential must stop before contacting anything. Exit 1,
    # and — the part that matters — zero provider calls, which the python suite
    # asserts directly (test_plan_without_a_token_never_contacts_anything).
    - name: "ip-rotation | plan without HCLOUD_TOKEN exits 1"
      ansible.builtin.command:
        cmd: "python3 rotate.py plan --config rotation.example.yml"
        chdir: "{{ _proj }}"
      environment:
        HCLOUD_TOKEN: ""
      register: _notoken
      changed_when: false
      failed_when: _notoken.rc != 1

    # ---- 2. the never-delete contract, by reading the source ----------------
    - name: "ip-rotation | read hcloud_step.yml"
      ansible.builtin.slurp:
        src: "{{ _step_file }}"
      register: _step_raw

    - name: "ip-rotation | read the composite setup action"
      ansible.builtin.set_fact:
        _setup_src: "{{ lookup('file', _repo ~ '/.github/actions/setup/action.yml') }}"

    # ⚠ `(?m)` INSTEAD OF split/map/join, AND THE REASON IS NOT WHAT IT LOOKS
    # LIKE. The split/map/join idiom works in no_delete_contract_offline_test.yml
    # and silently did nothing here. Measured 2026-08-26, same input, same
    # folded `>-` scalar, both spellings on ONE line so line count cannot be the
    # variable:
    #
    #   {{ src.split('\n') | length }}                     -> 1     (no split)
    #   {%- set n = src.split('\n') | length -%}{{ n }}     -> 4     (split)
    #   the same two in PURE Jinja2, no Ansible             -> 4, 4  (both)
    #
    # So it is not YAML folding, not the continuation line, and not Jinja: an
    # Ansible template of the `{{ }}` form does not deliver `\n` inside a
    # string literal as a newline, while a `{% %}` statement does. With the
    # split returning one element, `#.*$` (no re.M) then strips only the
    # FINAL line's comment — 3 hashes in, 2 out — which looks like a working
    # filter having a quiet day.
    #
    # THE RULE, which is all that matters downstream: do not rely on a `\n`
    # escape inside a Jinja string literal in Ansible. Use `(?m)`, or a real
    # newline, or put the pipeline in a `{% set %}`.
    #
    # It failed GREEN: five rules matched the banner that EXPLAINS those rules,
    # so the first run reported five violations that were all documentation. A
    # comment-stripper that strips nothing is otherwise invisible — hence the
    # assert immediately below, which is the real defence.
    - name: "ip-rotation | strip comments before scanning"
      ansible.builtin.set_fact:
        _step_body: "{{ (_step_raw.content | b64decode) | regex_replace('(?m)#.*$', '') }}"

    - name: "ip-rotation | the stripper actually stripped"
      ansible.builtin.assert:
        that:
          - (_step_body | length) < ((_step_raw.content | b64decode) | length)
          - not (_step_body is search('ONLY file in this repo'))
        fail_msg: >-
          Comment stripping produced no change, so every rule below is being
          matched against the banner that EXPLAINS the rules. The scan would
          report violations that are documentation.
        success_msg: "comments stripped"

    - name: "ip-rotation | find forbidden patterns"
      ansible.builtin.set_fact:
        _violations: >-
          {%- set out = [] -%}
          {%- for rule in forbidden -%}
          {%-   if _step_body is search(rule.pattern, multiline=True) -%}
          {%-     set _ = out.append(rule) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}

    - name: "ip-rotation | report each violation"
      ansible.builtin.debug:
        msg: "hcloud_step.yml matched /{{ item.pattern }}/ — {{ item.why | trim }}"
      loop: "{{ _violations }}"
      loop_control:
        label: "{{ item.pattern }}"

    - name: "ip-rotation | assert none"
      ansible.builtin.assert:
        that:
          - (_violations | length) == 0
        fail_msg: >-
          {{ _violations | length }} forbidden pattern(s) in hcloud_step.yml —
          see the messages above.
        success_msg: >-
          hcloud_step.yml is clean against {{ forbidden | length }} rules.

    # ---- 3. trap #2/#3: every `server` task is explicit about its address ---
    # Parsed as YAML rather than grepped: "the task two lines below has an
    # ipv4 key" is not something a regex can answer, and the whole point of
    # this rule is that an OMISSION is the bug.
    - name: "ip-rotation | parse hcloud_step.yml"
      ansible.builtin.set_fact:
        # NOT selectattr('hetzner.hcloud.server', 'defined') — Jinja reads a
        # dotted attribute name as a NESTED path, so that spelling looks for
        # item['hetzner']['hcloud']['server'], finds nothing, and the two
        # asserts below would pass by inspecting an empty list. The length
        # guard after them exists because that failure is invisible.
        _server_tasks: >-
          {%- set flat = [] -%}
          {%- set srv = [] -%}
          {%- for t in (lookup('file', _step_file) | from_yaml | first)['tasks'] -%}
          {%-   if t.block is defined -%}
          {%-     for b in t.block -%}{%- set _ = flat.append(b) -%}{%- endfor -%}
          {%-   else -%}{%- set _ = flat.append(t) -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- for t in flat -%}
          {%-   if 'hetzner.hcloud.server' in t -%}
          {%-     set _ = srv.append(t['hetzner.hcloud.server']) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ srv }}

    - name: "ip-rotation | every server task is state-only or names its ipv4"
      ansible.builtin.assert:
        that:
          - ('ipv4' in item) or ((item.keys() | list | difference(['id', 'state'])) | length == 0)
        fail_msg: >-
          A hetzner.hcloud.server task carries {{ item.keys() | list }}. On the
          create path an omitted `ipv4:` with the default `enable_ipv4: true`
          allocates a brand-new Primary IP nobody planned; and on the update
          path an omitted `ipv4:` makes `enable_ipv4: false` a silent no-op,
          because the collection only calls _update_server_ip() when `ipv4` is
          not None (server.py:607). Either name the address or restrict the
          task to `id` + `state`.
        quiet: true
      loop: "{{ _server_tasks }}"
      loop_control:
        label: "{{ item.keys() | list | join(', ') }}"

    # ---- the collection's vocabulary, which is version-specific ------------
    # hetzner.hcloud 7.0.0 REMOVED the `datacenter` parameter: Primary IPs are
    # location-scoped and every field is called `location`. A task still
    # spelling it `datacenter` fails at allocate time — i.e. with the node
    # already powered off, in the middle of the swap. This ran green offline
    # for a day because the dev box had 6.2.1 and CI installed latest.
    # Parsed, not grepped: the word `datacenter` appears in the comments right
    # above the task explaining why it must not appear IN the task.
    - name: "ip-rotation | collect the primary_ip tasks"
      ansible.builtin.set_fact:
        _ip_tasks: >-
          {%- set flat = [] -%}
          {%- set ips = [] -%}
          {%- for t in (lookup('file', _step_file) | from_yaml | first)['tasks'] -%}
          {%-   if t.block is defined -%}
          {%-     for b in t.block -%}{%- set _ = flat.append(b) -%}{%- endfor -%}
          {%-   else -%}{%- set _ = flat.append(t) -%}
          {%-   endif -%}
          {%- endfor -%}
          {%- for t in flat -%}
          {%-   if 'hetzner.hcloud.primary_ip' in t -%}
          {%-     set _ = ips.append(t['hetzner.hcloud.primary_ip']) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ips }}

    - name: "ip-rotation | no primary_ip task uses the parameter 7.x removed"
      ansible.builtin.assert:
        that:
          - "'datacenter' not in item"
        fail_msg: >-
          A hetzner.hcloud.primary_ip task names `datacenter`. The pinned
          collection (>=7.0.0,<8.0.0) has no such parameter — Primary IPs are
          location-scoped. Use `location:`, or change the pin in
          .github/actions/setup/action.yml and this rule together.
        quiet: true
      loop: "{{ _ip_tasks }}"
      loop_control:
        label: "{{ item.keys() | list | join(', ') }}"

    - name: "ip-rotation | the primary_ip tasks were actually found"
      ansible.builtin.assert:
        that:
          - (_ip_tasks | length) >= 1
        fail_msg: >-
          No hetzner.hcloud.primary_ip task was parsed, so the rule above
          inspected nothing. Same invisible-pass trap as the server tasks.
        quiet: true

    - name: "ip-rotation | the collection version is pinned, not latest"
      ansible.builtin.assert:
        that:
          - "'hetzner.hcloud:>=7.0.0,<8.0.0' in _setup_src"
        fail_msg: >-
          .github/actions/setup installs the collection unpinned. The field
          names this playbook is written against changed in a major bump, so
          `latest` means a rotation can break between two identical commits.
        quiet: true

    # The numeric id is immutable; a name can be changed by anyone with console
    # access. Every mutation in this file must address the server by id.
    - name: "ip-rotation | no server task targets by name"
      ansible.builtin.assert:
        that:
          - "'id' in item"
          - "'name' not in item"
        fail_msg: >-
          A hetzner.hcloud.server task targets by name. Use the immutable
          numeric id — a renamed server must abort the run, not redirect it.
        quiet: true
      loop: "{{ _server_tasks }}"
      loop_control:
        label: "{{ item.keys() | list | join(', ') }}"

    - name: "ip-rotation | there is at least one server task to check"
      ansible.builtin.assert:
        that:
          - (_server_tasks | length) >= 4
        fail_msg: >-
          Only {{ _server_tasks | length }} hetzner.hcloud.server task(s) found.
          The parser above probably stopped matching the file's shape, which
          would make the two asserts before this one pass by inspecting
          nothing. A test that cannot fail is worse than no test.
        success_msg: "{{ _server_tasks | length }} server tasks inspected"

    # ---- 4. things that must still be there --------------------------------
    - name: "ip-rotation | required patterns"
      ansible.builtin.assert:
        that:
          - (lookup('file', _repo ~ '/' ~ item.file)) is search(item.pattern, multiline=True)
        fail_msg: >-
          {{ item.file }} no longer contains /{{ item.pattern }}/ — {{ item.why | trim }}
        quiet: true
      loop: "{{ required }}"
      loop_control:
        label: "{{ item.file }} :: {{ item.pattern }}"

    - name: "ip-rotation | no rotation.yml or checkpoint was committed"
      ansible.builtin.find:
        paths: "{{ _proj }}"
        patterns: ["rotation.yml"]
        recurse: false
      register: _real_config

    - name: "ip-rotation | assert the real config stays out of git"
      ansible.builtin.assert:
        that:
          - (_real_config.files | length) == 0
            or (lookup('file', _repo ~ '/.gitignore') is search('rotation.yml'))
        fail_msg: >-
          rotation.yml exists and .gitignore does not cover
          it. It pins a real server id and a real project fingerprint.
        success_msg: "no operator config in the working tree"

    # ---- 5. cloudflare_replace_ip_step.yml: parallel rules ---------------
    # The same forbidden/required pattern as hcloud_step.yml — a delete in
    # either file is Rule One in action.
    - name: "ip-rotation | read cloudflare_replace_ip_step.yml"
      ansible.builtin.slurp:
        src: "{{ _cf_step_file }}"
      register: _cf_step_raw

    - name: "ip-rotation | strip comments before scanning"
      ansible.builtin.set_fact:
        _cf_step_body: "{{ (_cf_step_raw.content | b64decode) | regex_replace('(?m)#.*$', '') }}"

    - name: "ip-rotation | the stripper actually stripped (cloudflare)"
      ansible.builtin.assert:
        that:
          - (_cf_step_body | length) < ((_cf_step_raw.content | b64decode) | length)
        fail_msg: "comment stripping on cloudflare file produced no change."
        success_msg: "comments stripped (cloudflare)"

    - name: "ip-rotation | forbidden patterns in cloudflare_replace_ip_step.yml"
      ansible.builtin.assert:
        that:
          - not (_cf_step_body is search(item, multiline=True))
        fail_msg: "cloudflare_replace_ip_step.yml matched forbidden /{{ item }}/ — Rule One."
        quiet: true
      loop:
        - 'state:\s*absent'
        - 'method:\s*["'']DELETE["'']'
        - 'method:\s*DELETE'
        - 'has_more'
      loop_control:
        label: "{{ item }}"

    - name: "ip-rotation | required patterns in cloudflare_replace_ip_step.yml"
      ansible.builtin.assert:
        that:
          - (_cf_step_body is search(item, multiline=True))
        fail_msg: "cloudflare_replace_ip_step.yml is missing /{{ item }}/."
        quiet: true
      loop:
        - "lookup\\('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN'"
        - "no_log:\\s*true"
        - "result_info\\.total_pages"
        - "credential_ref"
        - "token_env"
      loop_control:
        label: "{{ item }}"

    # Per-task structural rule, not a text grep: every `ansible.builtin.uri`
    # task that supplies an Authorization header MUST also set no_log: true,
    # otherwise the token leaks into the Ansible log. The text-level rule
    # above catches the existence of "no_log: true" anywhere; this one proves
    # no authenticated uri task is missing it.
    - name: "ip-rotation | collect cloudflare uri tasks that carry Authorization"
      ansible.builtin.set_fact:
        _cf_uri_with_auth: >-
          {%- set out = [] -%}
          {%- set flat = [] -%}
          {%- for t in (lookup('file', _cf_step_file) | from_yaml | first)['tasks'] -%}
          {%-   if t.block is defined -%}
          {%-     for b in t.block -%}{%- set _ = flat.append(b) -%}{%- endfor -%}
          {%-   else -%}{%- set _ = flat.append(t) -%}{%- endif -%}
          {%- endfor -%}
          {%- for t in flat -%}
          {%-   if 'ansible.builtin.uri' in t -%}
          {%-     set hdrs = (t['ansible.builtin.uri'].headers | default({})) -%}
          {%-     if 'Authorization' in hdrs -%}
          {%-       set _ = out.append({
                   'name': t.get('name', '?'),
                   'no_log': (t.get('no_log') | default(False)) is sameas true
                 }) -%}
          {%-     endif -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}

    - name: "ip-rotation | the authenticated uri tasks were actually found"
      # `ansible.builtin.assert` runs once per loop entry. Without this
      # out-of-loop length check, a parser change that stops matching
      # the file shape (for example a task that nests the uri under a
      # second-level `block:`) leaves `_cf_uri_with_auth` empty, the
      # loop body never runs, and the per-item assertion never executes.
      # The next task then iterates an empty list and reports success.
      ansible.builtin.assert:
        that:
          - (_cf_uri_with_auth | length) > 0
        fail_msg: >-
          contract.yml's `_cf_uri_with_auth` selector matched zero
          `ansible.builtin.uri` tasks in cloudflare_replace_ip_step.yml.
          The contract parser has drifted from the file shape; the
          per-task no_log assertion below would silently green-light a
          regression. Fix the selector (or the playbook) before
          trusting this contract again.
        quiet: true

    - name: "ip-rotation | every authenticated uri task has no_log: true"
      ansible.builtin.assert:
        that:
          - (item.no_log | bool)
        fail_msg: >-
          cloudflare_replace_ip_step.yml has an `ansible.builtin.uri` task named
          "{{ item.name }}" that supplies an Authorization header but no `no_log: true`.
          The Authorization header value is the literal API token; it MUST be
          masked out of the Ansible log.
        quiet: true
      loop: "{{ _cf_uri_with_auth }}"
      loop_control:
        label: "{{ item.name }} (no_log={{ item.no_log }})"

    # ---- 6. cf_record_pages.yml: same structural rules --------------------
    # The pages 2..N include file is an extension of cloudflare_replace_ip_step;
    # the same forbidden patterns (ignore_errors, has_more, DELETE) and the
    # same required patterns (Authorization from env, no_log: true, total_pages)
    # apply. Without this contract a regression that adds ignore_errors to the
    # included file would silently re-introduce the fail-open path.
    - name: "ip-rotation | cf_record_pages.yml exists"
      ansible.builtin.stat:
        path: "{{ _proj }}/cf_record_pages.yml"
      register: _cf_pages_stat

    - name: "ip-rotation | cf_record_pages.yml forbidden patterns"
      ansible.builtin.assert:
        that:
          - _cf_pages_stat.stat.exists
          - not ((lookup('file', _cf_pages_stat.stat.path) | regex_replace('(?m)#.*$', '')) is search(item, multiline=True))
        fail_msg: "cf_record_pages.yml matched forbidden /{{ item }}/."
        quiet: true
      loop:
        - 'ignore_errors:\s*true'
        - 'state:\s*absent'
        - 'method:\s*DELETE'
        - 'has_more'
      loop_control:
        label: "{{ item }}"

    - name: "ip-rotation | cf_record_pages.yml required patterns"
      ansible.builtin.assert:
        that:
          - (lookup('file', _cf_pages_stat.stat.path) | regex_replace('(?m)#.*$', '')) is search(item, multiline=True)
        fail_msg: "cf_record_pages.yml is missing /{{ item }}/."
        quiet: true
      loop:
        - "lookup\\('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN'"
        - "no_log:\\s*true"
        - "cf_record_page_number"
        - "cf_record_expected_total_pages"
      loop_control:
        label: "{{ item }}"

    # ---- 7. provider-only workflow gate -------------------------------------
    # provider-only MUST be in the dispatch input options; the dns job MUST be
    # gated off; the swap job MUST be the only mutating job that runs. The
    # server-side guard in rotate.py is defense in depth.
    - name: "ip-rotation | run.yml exposes provider-only as an operation"
      ansible.builtin.assert:
        that:
          - (lookup('file', _proj ~ '/.github/workflows/run.yml')
              | regex_replace('(?m)#.*$', '')) is search("- provider-only", multiline=True)
        fail_msg: >-
          run.yml must list `provider-only` as a workflow_dispatch input option.
          Without it an operator with a throwaway test server has no way to
          swap the box without also touching DNS.
        quiet: true

    - name: "ip-rotation | run.yml gates the dns job on change-ip"
      ansible.builtin.assert:
        that:
          - (lookup('file', _proj ~ '/.github/workflows/run.yml')
              | regex_replace('(?m)#.*$', '')) is search("inputs.operation == 'change-ip'", multiline=True)
        fail_msg: >-
          run.yml's `dns` job must be gated on `inputs.operation ==
          'change-ip'` (a positive check). A bare
          `inputs.operation != 'provider-only'` is structurally weaker
          and we now require the explicit positive form. A successful
          provider-only run MUST NOT trigger any Cloudflare API call or
          Ansible playbook that touches Cloudflare.
        quiet: true

    - name: "ip-rotation | run.yml never unconditionally injects CLOUDFLARE_API_TOKEN"
      ansible.builtin.set_fact:
        _run_yml_body: "{{ lookup('file', _proj ~ '/.github/workflows/run.yml') | regex_replace('(?m)#.*$', '') }}"
        # Every line of run.yml that mentions the bare pattern
        # `CLOUDFLARE_API_TOKEN: secrets.CLOUDFLARE_API_TOKEN` MUST
        # be preceded by an `if:` gate within the same step. A step
        # without that gate would ship the token to every run that
        # reaches the step, including provider-only runs.
        #
        # The regex captures the line of the bare pattern and looks
        # BACKWARDS (10 lines, multiline flag) for the nearest `if:`.
        # If no `if:` is found in that window, the assertion fires.
        _cf_token_unconditional_pattern: >-
          (?ms)
          (?:^|\n)(?P<prefix>[^\n]*\n){0,10}
          (?P<line>[^\n]*CLOUDFLARE_API_TOKEN:\s*\$\{\{\s*secrets\.CLOUDFLARE_API_TOKEN\s*\}\}[^\n]*)
          (?P<suffix>[^\n]*\n){0,10}
          (?!.*\bif:)
        # Anchored search: each bare-token line, plus the 10 lines
        # above it, must contain `if:`. If a token line lacks an
        # `if:` within 10 lines above, the regex matches.
        _cf_token_unconditional_re: "(?ms)^(?:(?!\\bif:).)*CLOUDFLARE_API_TOKEN: \\$\\{\\{ secrets\\.CLOUDFLARE_API_TOKEN \\}\\}"


    - name: "ip-rotation | run.yml never unconditionally injects CLOUDFLARE_API_TOKEN (assert)"
      ansible.builtin.assert:
        that:
          - not (_run_yml_body is regex_search(_cf_token_unconditional_re, multiline=True))
        fail_msg: >-
          run.yml MUST NOT have any line `CLOUDFLARE_API_TOKEN:
          ${{ secrets.CLOUDFLARE_API_TOKEN }}` that is NOT preceded
          (within the same step) by an `if:` gate. A bare reference
          without an `if:` ships the token to every run that reaches
          the step, including provider-only. Add a positive `if:`
          gate (truth-table, not a falsy-ternary) before the step
          that carries the token, OR move the env to job-level only on
          jobs that already gate on the operator's `operation` choice.
        quiet: true

    - name: "ip-rotation | run.yml gates the CF token on the provider-only input"
      ansible.builtin.assert:
        that:
          - _run_yml_body is search("provider-only", multiline=True)
          - _run_yml_body is search("CLOUDFLARE_API_TOKEN", multiline=True)
        fail_msg: >-
          run.yml must condition the CLOUDFLARE_API_TOKEN env on the
          `provider-only` input, so the token stays empty when the operator
          picks provider-only.
        quiet: true

    # ---- 8. summary sanitisation --------------------------------------------
    # GitHub Actions publishes `$GITHUB_STEP_SUMMARY`, `$GITHUB_OUTPUT` and
    # stdout/stderr of every step. The contract is that none of these may
    # carry the Cloudflare token, the Authorization header value, the raw
    # URI result, the manifest contents, or the checkpoint contents. The
    # Python suite proves this for the Python side; the contract here proves
    # it for the playbook / repo source side: every authenticated URI is
    # no_log: true, and the playbook never calls `copy`/`template` with a
    # body that contains an Authorization header.
    - name: "ip-rotation | cloudflare_replace_ip_step.yml copy tasks contain no Authorization"
      ansible.builtin.set_fact:
        _cf_copy_with_auth: >-
          {%- set out = [] -%}
          {%- set raw = (lookup('file', _cf_step_file) | from_yaml | first)['tasks'] -%}
          {%- set flat = [] -%}
          {%- for t in raw -%}
          {%-   if t.block is defined -%}
          {%-     for b in t.block -%}{%- set _ = flat.append(b) -%}{%- endfor -%}
          {%-   else -%}{%- set _ = flat.append(t) -%}{%- endif -%}
          {%- endfor -%}
          {%- for t in flat -%}
          {%-   if 'ansible.builtin.copy' in t -%}
          {%-     set body = (t['ansible.builtin.copy'].content | default('')) | string -%}
          {%-     if 'Authorization' in body or 'CLOUDFLARE_API_TOKEN' in body -%}
          {%-       set _ = out.append(t.get('name', '?')) -%}
          {%-     endif -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}

    - name: "ip-rotation | cloudflare_replace_ip_step.yml copy tasks contain no Authorization (assert)"
      ansible.builtin.assert:
        that:
          - (_cf_copy_with_auth | length) == 0
        fail_msg: >-
          cloudflare_replace_ip_step.yml has a copy task whose body
          contains Authorization or the token name: {{ _cf_copy_with_auth }}.
          A result file carrying that body would land on Actions artifacts
          and on GITHUB_STEP_SUMMARY, leaking from there to any reader.
        quiet: true

    - name: "ip-rotation | rollback result does not leak manifest contents to stdout"
      ansible.builtin.assert:
        that:
          - not ((lookup('file', _cf_step_file) | regex_replace('(?m)#.*$', ''))
                 is search('debug:\\s*\\n[\\s\\S]*(?:manifest|previous_content|incomplete_records)', multiline=True))
        fail_msg: >-
          cloudflare_replace_ip_step.yml has a `debug` task whose message
          contains manifest fields. Manifest records and live content are
          not secrets but they ARE operational secrets in the broader
          sense — they go to GITHUB_STEP_SUMMARY and to stdout, and from
          there to anything that ever reads the run.
        quiet: true

    # ---- 9. cf_api_base production-vs-test seam -------------------------
    # The playbook reads cf_api_base from a vars: block whose default is
    # the official HTTPS endpoint. A caller may pass -e cf_api_base=...
    # but only when CF_PLAYBOOK_TEST_MODE=1 AND the URL is a loopback
    # fixture. Without this seam, a typo in -e could silently redirect
    # DNS-mutating requests to a wrong host.
    - name: "ip-rotation | cf_api_base default is the official HTTPS endpoint"
      ansible.builtin.assert:
        that:
          - >-
            (lookup('file', _cf_step_file) | regex_replace('(?m)#.*$', ''))
            is search("cf_api_base:\\s*[\"']https://api\\.cloudflare\\.com/client/v4[\"']", multiline=True)
        fail_msg: >-
          cloudflare_replace_ip_step.yml must default cf_api_base to the
          official https://api.cloudflare.com/client/v4 endpoint. A
          missing or non-official default would be the production URL
          drifting away from what Cloudflare publishes.
        quiet: true

    - name: "ip-rotation | cf_api_base override requires the test marker"
      ansible.builtin.assert:
        that:
          - >-
            (lookup('file', _cf_step_file) | regex_replace('(?m)#.*$', ''))
            is search('CF_PLAYBOOK_TEST_MODE', multiline=True)
        fail_msg: >-
          cloudflare_replace_ip_step.yml must require CF_PLAYBOOK_TEST_MODE
          to be '1' before accepting a custom cf_api_base. The marker is
          what stops an operator typo from redirecting the DNS half of a
          rotation to a wrong host.
        quiet: true

    - name: "ip-rotation | cf_api_base loopback regex appears in the validation"
      ansible.builtin.assert:
        that:
          - >-
            (lookup('file', _cf_step_file) | regex_replace('(?m)#.*$', ''))
            is search('127.0.0.1', multiline=True)
          - >-
            (lookup('file', _cf_step_file) | regex_replace('(?m)#.*$', ''))
            is search('localhost', multiline=True)
        fail_msg: >-
          cloudflare_replace_ip_step.yml must restrict the test-mode
          override to loopback addresses (127.0.0.1 / localhost / ::1).
          A wider allowlist would defeat the seam.
        quiet: true

    # ---- 10. provider-only run.yml audit ---------------------------------
    # Beyond the existing input-options gate, the workflow must not
    # reference `secrets.CLOUDFLARE_API_TOKEN` unconditionally; the token
    # must remain empty for provider-only runs. The earlier contract
    # already covers this; this block adds structural checks for the
    # broader provider-only invariants.
    - name: "ip-rotation | run.yml's CLOUDFLARE_API_TOKEN line is gated on provider-only"
      ansible.builtin.assert:
        that:
          - >-
            (lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', ''))
            is search("provider-only", multiline=True)
          - >-
            (lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', ''))
            is search("CLOUDFLARE_API_TOKEN", multiline=True)
        fail_msg: >-
          run.yml must condition the CLOUDFLARE_API_TOKEN env on the
          `provider-only` input. The forbidden shape is a bare
          `secrets.CLOUDFLARE_API_TOKEN` with no provider-only gate in
          the same expression — the empty-string short-circuit is
          falsy, and the secret leaks.
        quiet: true

    # ---- 11. parsed run.yml invariants ----------------------------------
    # The text-search tests above can be fooled by an unfalsified empty
    # string or by a bare `secrets.CLOUDFLARE_API_TOKEN` that has been
    # silently moved into a different env block. Parse the YAML and walk
    # every job and every step; assert that the token exists ONLY on
    # the steps that need it, and never on the swap or rollback's
    # provider-only path.
    - name: "ip-rotation | run.yml parses as YAML"
      ansible.builtin.set_fact:
        _run_yml: "{{ (lookup('file', _proj ~ '/.github/workflows/run.yml') | from_yaml) }}"

    - name: "ip-rotation | every job's env is structurally scanned"
      ansible.builtin.set_fact:
        _job_envs: >-
          {%- set out = {} -%}
          {%- for job_name, job in (_run_yml.get('jobs') or {}).items() -%}
            {%- set job_env_keys = [] -%}
            {%- if job.env is defined -%}
              {%- for k in job.env.keys() -%}
                {%- set _ = job_env_keys.append(k) -%}
              {%- endfor -%}
            {%- endif -%}
            {%- set _ = out.update({job_name: job_env_keys}) -%}
          {%- endfor -%}
          {{ out }}

    - name: "ip-rotation | swap job must not carry CLOUDFLARE_API_TOKEN"
      ansible.builtin.assert:
        that:
          - "'CLOUDFLARE_API_TOKEN' not in (_job_envs.get('swap', []))"
        fail_msg: >-
          swap job-level env carries CLOUDFLARE_API_TOKEN. The provider
          half never talks to Cloudflare. Move the token to step-level
          env on the DNS/rollback steps only.
        quiet: true

    - name: "ip-rotation | dns job must not carry CLOUDFLARE_API_TOKEN at job level"
      ansible.builtin.assert:
        that:
          - "'CLOUDFLARE_API_TOKEN' not in (_job_envs.get('dns', []))"
        fail_msg: >-
          dns job-level env carries CLOUDFLARE_API_TOKEN. The token must
          live on the resume step only — that way a failed
          in_scope check on a non-tracked node skips the CF step and the
          token never enters the env.
        quiet: true

    - name: "ip-rotation | rollback job must not carry CLOUDFLARE_API_TOKEN at job level"
      ansible.builtin.assert:
        that:
          - "'CLOUDFLARE_API_TOKEN' not in (_job_envs.get('rollback', []))"
        fail_msg: >-
          rollback job-level env carries CLOUDFLARE_API_TOKEN. The token
          must live on the dns-rollback step only — provider rollback
          must not even reference the secret.
        quiet: true

    # ---- 12. provider-only path structural invariants --------------------
    # Provider-only must:
    #   * skip the dns job entirely;
    #   * skip the verify job entirely;
    #   * not invoke the Cloudflare playbook or `make ip-change` (which
    #     runs the Cloudflare adapter);
    #   * not prompt for inventory modification.
    - name: "ip-rotation | run.yml has a provider-only option"
      ansible.builtin.assert:
        that:
          # YAML 1.1 (which Ansible's `from_yaml` uses) parses `on:` as
          # the boolean True. Look under both keys so the assertion is
          # robust against a future YAML-version upgrade.
          - "'provider-only' in ((_run_yml.get('on') or _run_yml.get(True) or {}).get('workflow_dispatch', {}).get('inputs', {}).get('operation', {}).get('options', []))"
        fail_msg: >-
          run.yml must list `provider-only` as an option in the
          workflow_dispatch operation input. Without it an operator
          with a throwaway test server has no way to swap the box
          without also touching DNS.
        quiet: true

    - name: "ip-rotation | dns job if: is positive == 'change-ip'"
      ansible.builtin.set_fact:
        _dns_if: "{{ (_run_yml.get('jobs') or {}).get('dns', {}).get('if', '') }}"

    - name: "ip-rotation | dns if: must be a positive operation gate"
      ansible.builtin.assert:
        that:
          - _dns_if is regex("inputs\\.operation == 'change-ip'")
        fail_msg: >-
          run.yml's `dns` job must use a positive
          `inputs.operation == 'change-ip'` gate. The previous
          `inputs.operation != 'provider-only'` is structurally
          weaker — a falsy `&&` short-circuit against an empty string
          lets the token through `||`.
        quiet: true

    - name: "ip-rotation | verify job if: gates on change-ip and dns success"
      ansible.builtin.set_fact:
        _verify_if: "{{ (_run_yml.get('jobs') or {}).get('verify', {}).get('if', '') }}"

    - name: "ip-rotation | verify job if: must NOT use always()"
      ansible.builtin.assert:
        that:
          - "'always()' not in _verify_if"
        fail_msg: >-
          run.yml's `verify` job uses `always()`. A green "verify"
          against a half-applied rotation is how a failed DNS run gets
          reported as success. Replace `always() && X` with
          `needs.dns.result == 'success' && X`.
        quiet: true

    - name: "ip-rotation | verify job if: must depend on dns.result == success"
      ansible.builtin.assert:
        that:
          - _verify_if is regex("needs\\.dns\\.result == 'success'")
        fail_msg: >-
          run.yml's `verify` job must require `needs.dns.result ==
          'success'`. A failed/skipped DNS job must NOT be followed by
          a green verify.
        quiet: true

    # ---- 13. $GITHUB_STEP_SUMMARY must NOT carry secrets ----------------
    # The summary is published to the public Actions UI on a public plan,
    # and to anyone with repo read access on a private plan. Assert
    # structurally that nothing in this repo's workflows writes to it
    # (so a future step cannot accidentally echo a token).
    - name: "ip-rotation | run.yml does not write to GITHUB_STEP_SUMMARY"
      ansible.builtin.set_fact:
        _step_summary_writes: >-
          {%- set out = [] -%}
          {%- set jobs = _run_yml.get('jobs') or {} -%}
          {%- for job_name, job in jobs.items() -%}
            {%- for step in (job.get('steps') or []) -%}
              {%- if step.run is defined -%}
                {%- if '$GITHUB_STEP_SUMMARY' in (step.run | string) -%}
                  {%- set _ = out.append(job_name ~ '/' ~ (step.name | default(step.get('id', '?')))) -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ out }}

    - name: "ip-rotation | no $GITHUB_STEP_SUMMARY writes anywhere in run.yml"
      ansible.builtin.assert:
        that:
          - (_step_summary_writes | length) == 0
        fail_msg: >-
          run.yml writes to $GITHUB_STEP_SUMMARY in these steps:
          {{ _step_summary_writes | join(', ') }}. Summary output is
          visible to anyone with read access; a future change must
          never add a token-bearing print there.
        quiet: true

    - name: "ip-rotation | no $GITHUB_OUTPUT writes that include secret-bearing data"
      ansible.builtin.set_fact:
        _gh_output_secret_writes: >-
          {%- set out = [] -%}
          {%- set jobs = _run_yml.get('jobs') or {} -%}
          {%- for job_name, job in jobs.items() -%}
            {%- for step in (job.get('steps') or []) -%}
              {%- if step.run is defined -%}
                {%- set run_str = step.run | string -%}
                {%- if 'GITHUB_OUTPUT' in run_str -%}
                  {%- if 'CLOUDFLARE' in run_str or 'secret' in run_str or 'token' in run_str -%}
                    {%- set _ = out.append(job_name ~ '/' ~ (step.name | default(step.get('id', '?')))) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ out }}

    - name: "ip-rotation | no $GITHUB_OUTPUT writes carry token-shaped data"
      ansible.builtin.assert:
        that:
          - (_gh_output_secret_writes | length) == 0
        fail_msg: >-
          run.yml's $GITHUB_OUTPUT writes mention secret-bearing data
          in: {{ _gh_output_secret_writes | join(', ') }}.
        quiet: true

    # ---- 14. provider-only rollback path has NO token reference --------
    # The rollback job's "Roll back the DNS records" step is gated on
    # `needs_dns_rollback == 'true'`; assert structurally that this
    # step's env is the only env block that references the token, and
    # that the rollback job has a "Roll back the provider IP" step
    # without it.
    - name: "ip-rotation | rollback job: only the DNS step carries the token"
      ansible.builtin.set_fact:
        _rollback_step_envs: >-
          {%- set out = [] -%}
          {%- for step in ((_run_yml.get('jobs') or {}).get('rollback', {}).get('steps') or []) -%}
            {%- set keys = [] -%}
            {%- if step.env is defined -%}
              {%- for k in step.env.keys() -%}
                {%- set _ = keys.append(k) -%}
              {%- endfor -%}
            {%- endif -%}
            {%- set _ = out.append({'name': step.name | default(step.id | default('?')), 'env': keys}) -%}
          {%- endfor -%}
          {{ out }}

    - name: "ip-rotation | provider-IP rollback step has no CF token"
      ansible.builtin.assert:
        that:
          - >-
            not (_rollback_step_envs
                 | selectattr('name', 'match', '.*[Pp]rovider.*IP.*')
                 | selectattr('env', 'contains', 'CLOUDFLARE_API_TOKEN')
                 | list)
        fail_msg: >-
          The provider-IP rollback step (the one without the Cloudflare
          playbook) carries CLOUDFLARE_API_TOKEN in its env. The token
          must live ONLY on the DNS rollback step.
        quiet: true

    - name: "ip-rotation | DNS rollback step carries CF token"
      ansible.builtin.assert:
        that:
          - >-
            (_rollback_step_envs
             | selectattr('name', 'match', '.*DNS.*')
             | selectattr('env', 'contains', 'CLOUDFLARE_API_TOKEN')
             | list | length) > 0
        fail_msg: >-
          The DNS rollback step does not carry CLOUDFLARE_API_TOKEN.
          Without it, the workflow cannot perform DNS recovery. Restore
          the token on this step.
        quiet: true

    # ---- 15. DataForest provider support ----------------------------------
    # The repo now ships a parallel DataForest provider. These tests prove
    # that the source files exist and carry the documented invariants, and
    # that no DataForest secret / endpoint / forbidden pattern leaks into
    # the workflow or the Hetzner-only playbooks.
    - name: "ip-rotation | DataForest adapter files exist"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: _df_files
      loop:
        - "{{ _proj }}/dataforest_adapter.py"
        - "{{ _proj }}/dataforest_guest_adapter.py"
        - "{{ _proj }}/dataforest_step.yml"
        - "{{ _proj }}/tests/fake_dataforest.py"
        - "{{ _proj }}/tests/test_dataforest.py"
      failed_when: not _df_files.stat.exists
      loop_control:
        label: "{{ item }}"

    - name: "ip-rotation | dataforest_step.yml has no ignore_errors / failed_when:false"
      ansible.builtin.set_fact:
        _df_step_body: "{{ lookup('file', _proj ~ '/dataforest_step.yml') | regex_replace('(?m)#.*$', '') }}"

    - name: "ip-rotation | dataforest_step.yml forbidden patterns"
      ansible.builtin.assert:
        that:
          - not (_df_step_body is search(item, multiline=True))
        fail_msg: "dataforest_step.yml matched forbidden /{{ item }}/ — Rule One."
        quiet: true
      loop:
        - 'state:\s*absent'
        - 'ignore_errors:\s*true'
        - 'failed_when:\s*false'
        - 'method:\s*DELETE'
      loop_control:
        label: "{{ item }}"

    - name: "ip-rotation | dataforest_adapter.py token handling"
      ansible.builtin.assert:
        that:
          - >-
            (lookup('file', _proj ~ '/dataforest_adapter.py')
            | regex_replace('(?m)#.*$', ''))
            is search('DATAFOREST_API_TOKEN')
        fail_msg: >-
          dataforest_adapter.py must read the token from DATAFOREST_API_TOKEN.
        quiet: true

    - name: "ip-rotation | providers.py has DataForestProvider"
      ansible.builtin.assert:
        that:
          - >-
            (lookup('file', _proj ~ '/providers.py')
            | regex_replace('(?m)#.*$', ''))
            is search('class DataForestProvider')
        fail_msg: >-
          providers.py must define DataForestProvider.
        quiet: true

    - name: "ip-rotation | rotate.py has DataForest state machine + finalize"
      ansible.builtin.assert:
        that:
          - >-
            (lookup('file', _proj ~ '/rotate.py')
            | regex_replace('(?m)#.*$', ''))
            is search('STEPS_DATAFOREST')
          - >-
            (lookup('file', _proj ~ '/rotate.py')
            | regex_replace('(?m)#.*$', ''))
            is search('finalize')
          - >-
            (lookup('file', _proj ~ '/rotate.py')
            | regex_replace('(?m)#.*$', ''))
            is search('awaiting_finalize')
        fail_msg: >-
          rotate.py must define STEPS_DATAFOREST, an explicit finalize
          subcommand, and an awaiting_finalize state label.
        quiet: true

    - name: "ip-rotation | DataForest endpoint seam defaults to production"
      ansible.builtin.assert:
        that:
          - >-
            (lookup('file', _proj ~ '/dataforest_adapter.py')
            | regex_replace('(?m)#.*$', ''))
            is search("DEFAULT_BASE_URL = \"https://api\\.dataforest\\.net/api/v1/public\"")
        fail_msg: >-
          dataforest_adapter.py must default to the official
          https://api.dataforest.net/api/v1/public endpoint.
        quiet: true

    - name: "ip-rotation | DataForest test-mode marker required"
      ansible.builtin.assert:
        that:
          - >-
            (lookup('file', _proj ~ '/dataforest_adapter.py')
            | regex_replace('(?m)#.*$', ''))
            is search('TEST_MARKER_ENV')
          - >-
            (lookup('file', _proj ~ '/dataforest_adapter.py')
            | regex_replace('(?m)#.*$', ''))
            is search('127\\.0\\.0\\.1')
          - >-
            (lookup('file', _proj ~ '/dataforest_adapter.py')
            | regex_replace('(?m)#.*$', ''))
            is search('localhost')
        fail_msg: >-
          dataforest_adapter.py must require a TEST_MARKER_ENV export AND
          a loopback host before accepting a non-production base URL.
        quiet: true

    - name: "ip-rotation | DataForest PAT never appears on Hetzner-only jobs"
      ansible.builtin.assert:
        that:
          - >-
            ((lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', '') | from_yaml).jobs.swap
            .env.DATAFOREST_API_TOKEN is not defined)
          - >-
            ((lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', '') | from_yaml).jobs.dns
            .env.DATAFOREST_API_TOKEN is not defined)
          - >-
            ((lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', '') | from_yaml).jobs.verify
            .env.DATAFOREST_API_TOKEN is not defined)
          - >-
            ((lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', '') | from_yaml).jobs.rollback
            .env.DATAFOREST_API_TOKEN is not defined)
        fail_msg: >-
          Hetzner jobs (swap/dns/verify/rollback) MUST NOT carry
          DATAFOREST_API_TOKEN. The DataForest secret lives ONLY on the
          DataForest-only jobs (swap_dataforest / finalize /
          rollback_dataforest).
        quiet: true

    - name: "ip-rotation | DataForest jobs never carry Cloudflare or Hetzner tokens"
      ansible.builtin.assert:
        that:
          - >-
            ((lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', '') | from_yaml).jobs.swap_dataforest
            .env.HCLOUD_TOKEN is not defined)
          - >-
            ((lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', '') | from_yaml).jobs.swap_dataforest
            .env.CLOUDFLARE_API_TOKEN is not defined)
          - >-
            ((lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', '') | from_yaml).jobs.dataforest_provider_finalize
            .env.HCLOUD_TOKEN is not defined)
          - >-
            ((lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', '') | from_yaml).jobs.dataforest_provider_finalize
            .env.CLOUDFLARE_API_TOKEN is not defined)
          - >-
            ((lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', '') | from_yaml).jobs.rollback_dataforest
            .env.HCLOUD_TOKEN is not defined)
          - >-
            ((lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', '') | from_yaml).jobs.rollback_dataforest
            .env.CLOUDFLARE_API_TOKEN is not defined)
        fail_msg: >-
          DataForest jobs MUST NOT carry HCLOUD_TOKEN or CLOUDFLARE_API_TOKEN.
        quiet: true

    - name: "ip-rotation | finalize commands dispatch via rotate.py"
      ansible.builtin.assert:
        that:
          - >-
            'rotate.py finalize-precheck' in (lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', ''))
          - >-
            'rotate.py provider-finalize' in (lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', ''))
        fail_msg: >-
          finalize precheck MUST invoke `python3 rotate.py finalize-precheck`;
          provider-finalize MUST invoke `python3 rotate.py provider-finalize`.
          The two stages run in separate jobs on separate environments.
        quiet: true

    - name: "ip-rotation | workflow_dispatch lists finalize + dataforest"
      ansible.builtin.set_fact:
        _run_yml: >-
          {{ (lookup('file', _proj ~ '/.github/workflows/run.yml')
          | regex_replace('(?m)#.*$', '') | from_yaml) }}
        _run_on: "{{ _run_yml['on'] if 'on' in _run_yml else _run_yml[True] }}"

    - name: "ip-rotation | workflow_dispatch.options include finalize and dataforest"
      ansible.builtin.assert:
        that:
          - "'finalize' in _run_on.workflow_dispatch.inputs.operation.options"
          - "'dataforest' in _run_on.workflow_dispatch.inputs.provider.options"
        fail_msg: >-
          workflow_dispatch must list `finalize` as an operation option
          and `dataforest` as a provider option.
        quiet: true

    - name: "ip-rotation | finalize jobs gate is positive == 'finalize' AND provider dataforest"
      ansible.builtin.assert:
        that:
          - >-
            _run_yml.jobs.cloudflare_finalize_precheck.if is regex("inputs\\.operation == 'finalize'")
          - >-
            _run_yml.jobs.cloudflare_finalize_precheck.if is regex("inputs\\.provider == 'dataforest'")
          - >-
            _run_yml.jobs.dataforest_provider_finalize.if is regex("inputs\\.operation == 'finalize'")
          - >-
            _run_yml.jobs.dataforest_provider_finalize.if is regex("inputs\\.provider == 'dataforest'")
        fail_msg: >-
          finalize jobs MUST use a positive == gate on BOTH
          inputs.operation == 'finalize' AND inputs.provider == 'dataforest'.
        quiet: true

    - name: "ip-rotation | finalize does not depend on any non-finalize live job"
      ansible.builtin.assert:
        that:
          # cloudflare_finalize_precheck has no needs (it's the first
          # finalize stage). dataforest_provider_finalize depends
          # ONLY on the precheck.
          - "_run_yml.jobs.cloudflare_finalize_precheck.needs is not defined"
          - >-
            (_run_yml.jobs.dataforest_provider_finalize.needs | default([]))
            | intersect(['swap_dataforest', 'swap_dataforest_guest',
                        'swap_dataforest_dns', 'plan_dataforest',
                        'rollback_dataforest', 'plan', 'swap', 'dns',
                        'verify', 'rollback']) | length == 0
        fail_msg: >-
          finalize jobs MUST NOT depend on any non-finalize live job.
          The precheck has no needs; the provider step depends only
          on the precheck.
          No automatic dependency may reach it.
        quiet: true

    - name: "ip-rotation | swap_dataforest if does NOT mention finalize"
      ansible.builtin.assert:
        that:
          - "'finalize' not in _run_yml.jobs.swap_dataforest.if"
        fail_msg: >-
          swap_dataforest's `if` MUST NOT mention `finalize` — only an
          explicit `operation: finalize` dispatch should reach finalize.
        quiet: true

    # The if expression is `(op in {change-ip,provider-only}) AND provider == dataforest`.
    # Without parens, `&&` binds tighter than `||`, so a bare
    # `change-ip || provider-only && dataforest` would be
    # `change-ip || (provider-only && dataforest)` and would let any
    # hcloud change-ip dispatch reach the DataForest job. The contract
    # therefore REQUIRES parentheses AND a separate positive `==`
    # guard for provider. The truth table below tests the parsed
    # expression and the gate independently.
    - name: "ip-rotation | swap_dataforest uses positive gates (truth table)"
      vars:
        _tbl:
          - op: change-ip
            provider: dataforest
            expect: true
          - op: provider-only
            provider: dataforest
            expect: true
          - op: change-ip
            provider: hcloud
            expect: false
          - op: provider-only
            provider: hcloud
            expect: false
          - op: finalize
            provider: dataforest
            expect: false
          - op: finalize
            provider: hcloud
            expect: false
          - op: rollback
            provider: dataforest
            expect: false
          - op: rollback
            provider: hcloud
            expect: false
          - op: plan
            provider: dataforest
            expect: false
          - op: plan
            provider: hcloud
            expect: false
      loop: "{{ _tbl }}"
      loop_control:
        label: "{{ item.op }}/{{ item.provider }}"
      ansible.builtin.assert:
        that:
          - >-
            ((item.op == 'change-ip' or item.op == 'provider-only')
            and item.provider == 'dataforest') == item.expect
        fail_msg: >-
          The truth table for swap_dataforest's if: must produce exactly
          the expected boolean for every (op, provider) combination.
          The actual table currently produces
          `{{ ((item.op == 'change-ip' or item.op == 'provider-only') and item.provider == 'dataforest') }}`
          for op={{ item.op }} provider={{ item.provider }}; expected
          {{ item.expect }}.
        quiet: true

    - name: "ip-rotation | every live job if: contains the expected gate token"
      vars:
        _jobs:
          - job: swap
            required: "provider == 'hcloud'"
          - job: dns
            required: "provider == 'hcloud'"
          - job: verify
            required: "provider == 'hcloud'"
          - job: rollback
            required: "provider == 'hcloud'"
          - job: swap_dataforest
            required: "provider == 'dataforest'"
          - job: cloudflare_finalize_precheck
            required: "provider == 'dataforest'"
          - job: dataforest_provider_finalize
            required: "provider == 'dataforest'"
          - job: rollback_dataforest
            required: "provider == 'dataforest'"
      loop: "{{ _jobs }}"
      loop_control:
        label: "{{ item.job }}"
      ansible.builtin.assert:
        that:
          - "_run_yml.jobs[item.job].if is regex(item.required)"
        fail_msg: >-
          Job {{ item.job }} MUST contain a positive == '{{ item.required }}'
          gate in its `if:` expression. The current value is
          `{{ _run_yml.jobs[item.job].if }}`.
        quiet: true

    - name: "ip-rotation | Hetzner plan job does NOT carry DATAFOREST_API_TOKEN"
      ansible.builtin.assert:
        that:
          - >-
            ((lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', '') | from_yaml)
            .jobs.plan.env.DATAFOREST_API_TOKEN is not defined)
            or
            ((lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', '') | from_yaml)
            .jobs.plan.env.DATAFOREST_API_TOKEN) == '${{ secrets.DATAFOREST_API_TOKEN }}'
        fail_msg: >-
          The Hetzner `plan` job MUST NOT export DATAFOREST_API_TOKEN.
          Provider plan scoping requires a separate plan job for each
          provider. The current value leaks the DataForest PAT to every
          Hetzner plan run.
        quiet: true

    - name: "ip-rotation | workflow_dispatch has a provider-scoped plan job"
      ansible.builtin.assert:
        that:
          - "_run_yml.jobs.plan_dataforest is defined"
          - >-
            _run_yml.jobs.plan_dataforest.if is regex("inputs\\.provider == 'dataforest'")
          - >-
            _run_yml.jobs.plan_dataforest.env.DATAFOREST_API_TOKEN is defined
          - >-
            _run_yml.jobs.plan_dataforest.env.HCLOUD_TOKEN is not defined
        fail_msg: >-
          workflow.yml MUST define a separate plan_dataforest job whose
          `if:` requires provider == 'dataforest' and whose env block
          exports DATAFOREST_API_TOKEN but NOT HCLOUD_TOKEN.
        quiet: true

    - name: "ip-rotation | no falsy-ternary expressions on secrets"
      ansible.builtin.assert:
        that:
          - >-
            not ((lookup('file', _proj ~ '/.github/workflows/run.yml')
            | regex_replace('(?m)#.*$', ''))
            is regex("cond && ''\\s*\\|\\|\\s*secrets\\."))
        fail_msg: >-
          run.yml MUST NOT use the falsy-ternary
          `cond && '' || secrets.<X>` pattern — empty strings are falsy
          in GitHub expressions and the secret leaks through `||`.
        quiet: true

    - name: "ip-rotation | Hetzner jobs require provider == hcloud"
      ansible.builtin.assert:
        that:
          - >-
            _run_yml.jobs.swap.if is regex("inputs\\.provider == 'hcloud'")
          - >-
            _run_yml.jobs.dns.if is regex("inputs\\.provider == 'hcloud'")
          - >-
            _run_yml.jobs.verify.if is regex("inputs\\.provider == 'hcloud'")
          - >-
            _run_yml.jobs.rollback.if is regex("inputs\\.provider == 'hcloud'")
        fail_msg: >-
          Each Hetzner-only job (swap / dns / verify / rollback) MUST
          require provider == 'hcloud'. A bare `if: inputs.operation ==
          'change-ip'` would let a DataForest run reach Hetzner jobs.
        quiet: true
